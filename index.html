function gmParkingInboundVehicles(elapsed){
  return (STATE.vehicles||[]).filter(function(v){
    if(v.deploymentState==='TO_PARKING')return Number(v.busyUntilElapsed||0)>elapsed;
    if(v.deploymentState==='HOSPITAL_TRIP'){
      const hospitalAt=Number(v.busyStartElapsed||0)+Math.max(0,Number(v.outboundMin||0));
      return elapsed>=hospitalAt&&Number(v.busyUntilElapsed||0)>elapsed;
    }
    return false;
  }).sort(function(a,b){return Number(a.busyUntilElapsed||0)-Number(b.busyUntilElapsed||0)||String(a.name).localeCompare(String(b.name));});

function gmPatientActivityHtml(p,elapsed){
  if(patientIsDead(p,elapsed)||(p.closedReason&&String(p.closedReason).indexOf('DEAD')===0)){
    const wrongVehicle=String(p.closedReason||'')==='DEAD_WRONG_VEHICLE'||(p.hospitalCare&&p.hospitalCare.transportHarm);
    const reason=wrongVehicle?'เสียชีวิตเนื่องจากใช้รถไม่เหมาะสม':deathReasonFor(p,elapsed);
    return '<span class="badge dead">เสียชีวิต</span><div class="hint" style="margin-top:4px;color:var(--red)">'+esc(reason)+'</div>';
  }
  if(p.stage==='HOSPITAL'&&p.hospitalCare){
    const phase=hospitalCarePhase(p,elapsed);
    if(phase==='IN_TRANSIT'){
      return '<span class="badge wait">🚑 ไป '+esc(p.hospital||'โรงพยาบาล')+' · '+liveCountdownHtml(p.hospitalCare.arrivalAt,elapsed,'ถึงโรงพยาบาล')+'</span>';
    }
  }
  const active=allTreatmentSlots(p).find(function(slot){return slot&&txSlotStatus(slot,elapsed)==='IN_PROGRESS';});
  if(active){
    return '<span class="badge wait"><span class="pulse-dot"></span> '+esc(active.item)+' · '+treatmentLocationLabel(active.location)+' · '+liveCountdownHtml(active.startedAt+active.durationSec/60,elapsed,'เสร็จ')+'</span>';
  }
  if(p.stage==='PRIMARY')return p.primary?'รอส่ง Secondary':'รอ Primary Triage';
  if(p.stage==='SECONDARY')return p.secondary?'รอส่ง Treatment':'รอ Secondary Triage';
  if(p.stage==='TX'){
    const status=computeTxStatus(p,findCase(STATE.cases,p.id),elapsed);
    return status==='STABILIZED'?'<span class="badge ok">พร้อมส่งต่อ</span>':'รอเริ่ม Treatment';
  }
  if(p.stage==='TRANSFER')return (p.vehicle||p.hospital)?'จัดรถ '+esc(p.vehicle||'—')+' → '+esc(p.hospital||'—'):'รอเลือกรถและโรงพยาบาล';
  if(p.stage==='HOSPITAL')return '<span class="badge wait">รอผลการรักษาที่โรงพยาบาล</span>';
  if(p.stage==='TRANSIT'&&p.transit){
    return 'ไป '+(p.transit.toStage==='TX'?'Treatment '+esc(p.transit.txZone||''):esc(p.transit.toStage))+' · '+liveCountdownHtml(p.transit.arriveElapsed,elapsed,'ถึงปลายทาง');
  }
  return '—';
}

    const slotStatus=txSlotStatus(slot,elapsed);
    const interrupted=outcome.kind==='dead'&&(Number(slot.startedAt)+Number(slot.durationSec||0)/60)>deathAt;
    const status=interrupted?'หยุดเมื่อผู้ป่วยเสียชีวิต':slotStatus==='PENDING'?'รอเริ่ม':slotStatus==='IN_PROGRESS'?'กำลังทำ':'เสร็จ';
    return '<span class="badge '+(status==='เสร็จ'?'ok':interrupted?'bad':'wait')+'">'+esc(slot.item)+' · '+treatmentLocationLabel(slot.location)+' · '+status+'</span>';
  });
  return items.length?'<div class="tx-history">'+items.join('')+'</div>':'<span class="hint">ยังไม่มี</span>';
}

function archiveParticipantRecords(ctx){
  const map={},savedParticipants=ctx.gc&&ctx.gc.participants||{};

    if(!name||name==='SYSTEM'||name==='HOSPITAL')return null;
    if(!map[name])map[name]={name:name,firstSeenAt:null,lastSeenAt:null,lastStation:null,history:[],events:[],counts:{PRIMARY:0,SECONDARY:0,TREATMENT:0,TRANSFER:0,COMMUNICATION:0,GAME:0}};
    return map[name];
  }
  Object.keys(savedParticipants&&typeof savedParticipants==='object'?savedParticipants:{}).forEach(function(name){
    const src=savedParticipants[name]||{},row=ensure(name);if(!row)return;
    row.firstSeenAt=src.firstSeenAt!=null?Number(src.firstSeenAt):row.firstSeenAt;row.lastSeenAt=src.lastSeenAt!=null?Number(src.lastSeenAt):row.lastSeenAt;row.lastStation=src.lastStation||row.lastStation;row.history=(src.history||[]).map(function(h){return Object.assign({},h);});
  });
  Object.keys(ctx.roster||{}).forEach(function(name){const row=ensure(name),r=ctx.roster[name]||{};if(row)row.lastStation=r.station||row.lastStation;});
  const timeline=withArchiveState(ctx,function(){return buildMasterTimeline(reviewElapsed(ctx)).map(function(e){return Object.assign({},e,{description:timelineDescription(e)});});});
  timeline.forEach(function(e){const row=ensure(e.by);if(!row)return;const category=debriefEventCategory(e.type);if(row.counts[category]!=null)row.counts[category]++;else row.counts.GAME++;row.firstSeenAt=row.firstSeenAt==null?Number(e.t)||0:Math.min(row.firstSeenAt,Number(e.t)||0);row.lastSeenAt=row.lastSeenAt==null?Number(e.t)||0:Math.max(row.lastSeenAt,Number(e.t)||0);row.events.push({t:Number(e.t)||0,type:e.type,description:e.description,patientId:e.patient&&e.patient.id||null,category:category});});
  return Object.keys(map).map(function(name){const row=map[name];row.events.sort(function(a,b){return a.t-b.t;});row.history.sort(function(a,b){return Number(a.t)-Number(b.t);});if(!row.lastStation&&row.history.length)row.lastStation=row.history[row.history.length-1].station||null;return row;}).sort(function(a,b){return (a.lastStation==='GM'?1:0)-(b.lastStation==='GM'?1:0)||a.name.localeCompare(b.name);});
}

    const result=triageDecisionResult(type.slice(17),caseObj.primary);
    return {ok:result==='CORRECT',text:result==='CORRECT'?'Primary Triage ถูกต้อง ✅':'Primary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
  }
  if(type==='PRIMARY_AUTO_GREEN'||type.indexOf('PRIMARY_CORRECTED_AT_SECONDARY ')===0){
    const guess=type==='PRIMARY_AUTO_GREEN'?'GREEN':type.slice(31),result=triageDecisionResult(guess,caseObj.primary);
    return {ok:result==='CORRECT',text:result==='CORRECT'?'Primary Triage ถูกต้อง ✅':'Primary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
  }
  if(type.indexOf('SECONDARY_CLASSIFY ')===0){
    const result=triageDecisionResult(type.slice(19),caseObj.secondary);
    return {ok:result==='CORRECT',text:result==='CORRECT'?'Secondary Triage ถูกต้อง ✅':'Secondary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
  }

    const hasClassify=(p.events||[]).some(function(e){return e.type.indexOf('PRIMARY_CLASSIFY ')===0;});
    if(!hasClassify){
      const result=triageDecisionResult(p.primary,caseObj.primary);
      return {ok:result==='CORRECT',text:result==='CORRECT'?'Primary Triage ถูกต้อง ✅':'Primary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
    }
  }

    const hasClassify=(p.events||[]).some(function(e){return e.type.indexOf('SECONDARY_CLASSIFY ')===0;});
    if(!hasClassify){

      return {ok:result==='CORRECT',text:result==='CORRECT'?'Secondary Triage ถูกต้อง ✅':'Secondary Triage ไม่ถูกต้อง ❌ ('+(result==='OVER'?'Overtriage':result==='UNDER'?'Undertriage':'Wrong')+')'};
    }
  }
  const item=treatmentItemFromEvent(type);
  if(item){
    const appropriate=(caseObj.reqTx||[]).indexOf(item)>-1;
    return {ok:appropriate,text:appropriate?'Treatment เหมาะสม ✅':'Treatment ไม่ตรง Required Tx ❌'};

function animateDispatchExit(){
  return new Promise(function(resolve){
    const vehicle=document.getElementById('dispatchVehicleVisual');
    const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!vehicle||reduced){resolve();return;}
    vehicleAnimationBusy=true;
    vehicle.classList.add('dispatching-vehicle');
    let done=false;const finish=function(){if(done)return;done=true;vehicleAnimationBusy=false;if(backgroundRenderPending)scheduleBackgroundRender();resolve();};
    vehicle.addEventListener('animationend',finish,{once:true});
    setTimeout(finish,850);
  });
}

  if(act==='txMoveZone'){ await txMoveZone(el.dataset.pid, el.dataset.to); STATE.ui.twoD.panelMinimized=true; saveLocalSession(); render(true); return; }
  if(act==='supplyTake'){ await pickupSupplyItem(el.dataset.zone, el.dataset.item); return; }
  if(act==='supplyReturn'){const result=await returnCarriedItemToSupply(el.dataset.item);toast(result.message,result.ok?'ok':'err');return;}
  if(act==='twoDBoardTransferPatient'){await boardTransferPatientFromPanel(el.dataset.pid,el.dataset.vehicle);return;}
  if(act==='twoDClearTransferPatient'){STATE.ui.twoD.detailPatientId=null;saveLocalSession();render(true);return;}
  if(act==='requestPorter'){ await requestPorterJob(el.dataset.pid, el.dataset.from, el.dataset.to); STATE.ui.twoD.panelMinimized=true; saveLocalSession(); render(true); return; }
  if(act==='porterDeploy'){ if(STATE.me.station!=='GM'){toast('เฉพาะ GM เท่านั้นที่ส่งพนักงานเปลเข้าพื้นที่ได้','err');return;}await deployPortersToScene(el.dataset.qty);return; }
  if(act==='porterSetTotal'){ if(STATE.me.station!=='GM'){toast('เฉพาะ GM เท่านั้นที่กำหนดจำนวนพนักงานเปลได้','err');return;}await setPorterTotal(val('gmPorterTotal'));return; }
  if(act==='cancelPorter'){ if(confirm('ยกเลิกคำขอพนักงานเปล?')) await cancelPorterJob(el.dataset.job); return; }
  if(act==='dispatchSend'){ await dispatchSend(el.dataset.vehicle); return; }
  if(act==='transferVehicleLocal'){
    const nextVehicle=el.dataset.vehicle||null,previousVehicle=STATE.ui.transfer.vehicle;
    if(!nextVehicle||!await claimVehicleLock(nextVehicle))return;
    await releasePatientLocks((STATE.ui.transfer.patientIds||[]).concat(previousVehicle&&previousVehicle!==nextVehicle?[vehicleLockKey(previousVehicle)]:[]));
    STATE.ui.transfer.vehicle=nextVehicle;
    STATE.ui.transfer.patientIds=[];
    saveLocalSession();render(true);return;
  }
  if(act==='transferVehicleClear'){
    await releasePatientLocks((STATE.ui.transfer.patientIds||[]).concat(STATE.ui.transfer.vehicle?[vehicleLockKey(STATE.ui.transfer.vehicle)]:[]));
    STATE.ui.transfer={vehicle:null,patientIds:[],hospital:null};
    saveLocalSession();render(true);return;
  }
  if(act==='transferPatientLocal'){
    if(!STATE.ui.transfer.vehicle){toast('เลือกรถก่อน','err');return;}
    const id=normU(el.dataset.pid),ids=(STATE.ui.transfer.patientIds||[]).slice(),i=ids.indexOf(id);
    if(i>-1){ids.splice(i,1);await releasePatientLocks([id]);}
    else{
      const patient=STATE.patients.find(function(p){return normU(p.id)===id;});
      if(!patient||patient.stage!=='TRANSFER'){toast('ผู้ป่วยไม่ได้อยู่ใน Transfer แล้ว','err');return;}
      if(patientIsDead(patient,elapsedMinutes(STATE.gc))){toast('ผู้ป่วยเสียชีวิตแล้ว ไม่สามารถนำขึ้นรถได้','err');return;}
      if(!await claimPatientLock(id,'TRANSFER'))return;
      ids.push(id);
    }
    STATE.ui.transfer.patientIds=ids;saveLocalSession();render(true);return;
  }
  if(act==='transferSendBatch'){
    const ui=STATE.ui.transfer;
    const sendButton=el;sendButton.disabled=true;sendButton.textContent='กำลังส่งรถ...';
    const sent=await dispatchSend(ui.vehicle,(ui.patientIds||[]).slice(),ui.hospital,true);
    if(sent){await animateDispatchExit();STATE.ui.transfer={vehicle:null,patientIds:[],hospital:null};saveLocalSession();render(true);}
    else{sendButton.disabled=false;sendButton.textContent='SEND รถพร้อมผู้ป่วย';}
    return;
  }
  if(act==='gmAssign'){ /* handled on change */ return; }
}

async function handleChange(el){
  const act = el.dataset.act;
  if(act==='gmResourceAutoSave'){scheduleGmResourceMatrixSave(el.dataset.item,true);return;}
  if(act==='gmCaseSpawn'){await gmSetCaseSpawned(el.dataset.id,!!el.checked);return;}
  if(act==='toggleGMPassword'){
    const wrap = document.getElementById('gmPasswordWrap');
    const passwordInput = document.getElementById('joinGMPassword');
    const commanderCheckbox = document.getElementById('joinAsCommander');
    if(wrap) wrap.style.display = el.checked ? 'block' : 'none';
    if(el.checked){
      if(commanderCheckbox) commanderCheckbox.checked = false;
      if(passwordInput) passwordInput.focus();
    }else if(passwordInput){
      passwordInput.value = '';
    }
    return;
  }
  if(act==='toggleCommanderRole'){
    if(el.checked){
      const gmCheckbox = document.getElementById('joinAsGM');
      const wrap = document.getElementById('gmPasswordWrap');
      const passwordInput = document.getElementById('joinGMPassword');
      if(gmCheckbox) gmCheckbox.checked = false;
      if(wrap) wrap.style.display = 'none';
      if(passwordInput) passwordInput.value = '';
    }
    return;
  }
  if(act==='transportModeChange'){
    const ok=await gmUpdateConfig({transportMode:el.value==='COMBINED'?'COMBINED':'SPLIT'});
    if(ok)toast(el.value==='COMBINED'?'เปลี่ยนเป็น Extern Mode · Loading + Parking แล้ว':'เปลี่ยนเป็น Resident Mode · แยก Loading / Parking แล้ว','ok');return;
  }
  if(act==='gmAssign'){ await gmAssignStation(el.dataset.name, el.value); return; }
  if(act==='commandRequestSelection'){
    if(!STATE.ui.commandRequests)STATE.ui.commandRequests={};
    const current=Object.assign({},STATE.ui.commandRequests[el.dataset.request]||{});current[el.dataset.field]=el.value||'';STATE.ui.commandRequests[el.dataset.request]=current;saveLocalSession();return;
  }
  if(act==='fastTreatmentToggle'){ await gmSetFastTreatment(el.checked); return; }
  if(act==='hospitalTreatmentToggle'){ await gmSetHospitalTreatment(el.checked); return; }
  if(act==='externVehiclesReadyToggle'){ await gmSetExternVehiclesReady(el.checked); return; }
  if(act==='transferHospitalLocal'){STATE.ui.transfer.hospital=el.value||null;saveLocalSession();render(true);return;}
  if(act==='transferSet'){ await transferAssign(el.dataset.pid, el.dataset.field, el.value); return; }
  if(act==='txNote'){ await txSetNote(el.dataset.pid,el.value); return; }
  if(act==='txDx'){ await txSetDx(el.dataset.pid,el.value); return; }
  if(act==='txSelect'){
    if(!el.value) return;
    await txStartItem(el.dataset.pid, Number(el.dataset.slot), el.value, 'TX');
    STATE.ui.twoD.panelMinimized=true; saveLocalSession(); render(true);
    return;
  }
  if(act==='triageTxSelect'){
    if(!el.value) return;
    await txStartItem(el.dataset.pid, Number(el.dataset.slot), el.value, el.dataset.stage);
    STATE.ui.twoD.panelMinimized=true; saveLocalSession(); render(true);
    return;
  }
  if(act==='mapSettingToggle'){
    const keyByCheckboxId={cfgUseMap:'useMap', cfgDistSecondary:'distSecondary', cfgDistTreatment:'distTreatment', cfgDistTransfer:'distTransfer'};
    const key=keyByCheckboxId[el.dataset.key];
    if(!key) return;
    await gmSetMapSetting(key, el.checked);
    return;
  }
}

function boot(){
  fbInit();
  window.addEventListener('pointerdown',function(){ensureCommunicationAudio();},{once:true,capture:true});
  const svToggle = document.getElementById('sceneViewerToggle');
  if(svToggle){
    svToggle.addEventListener('click', function(){
      const host = document.getElementById('sceneViewerHost');
      if(host) host.classList.toggle('collapsed');
    });
  }
  const app = document.getElementById('app');
  app.addEventListener('click', function(e){
    const el = e.target.closest('[data-act]');
    if(!el || el.disabled) return;
    handleClick(el);
  });
  app.addEventListener('input',function(e){
    const resource=e.target.closest('[data-act="gmResourceAutoSave"]');
    if(resource)scheduleGmResourceMatrixSave(resource.dataset.item,false);
    const el=e.target.closest('[data-case-field]');
    if(el)captureCaseDraftValue(el);
  });
  app.addEventListener('change', function(e){
    const caseField=e.target.closest('[data-case-field]');
    if(caseField)captureCaseDraftValue(caseField);
    const el = e.target.closest('[data-act]');
    if(!el) return;
    handleChange(el);
  });
  app.addEventListener('focusout',function(){
    if(backgroundRenderPending)scheduleBackgroundRender();
  });
  app.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    const directAction=e.target.closest('[data-act="patientReviewLive"],[data-act="archivePatientReview"]');
    if(directAction){e.preventDefault();handleClick(directAction);return;}
    const el = e.target.closest('[data-enter-act]');
    if(!el) return;
    e.preventDefault();
    const act = el.dataset.enterAct;
    if(act==='join') handleClick({dataset:{act:'join'}});
    else if(act==='primaryRegister') handleClick({dataset:{act:'primaryRegister',input:el.id}});
    else if(act==='secondaryRegister') handleClick({dataset:{act:'secondaryRegister',input:el.id}});
    else if(act==='patientFocus')handleClick({dataset:{act:'patientFocus',key:el.dataset.focusKey,input:el.id}});
    else if(act==='archiveSave'){const button=document.querySelector('[data-act="archiveSave"]');if(button)handleClick(button);}
  });
  document.addEventListener('click',function(e){
    const el=e.target.closest('[data-comm-act]');
    if(!el||el.disabled)return;
    handleCommunicationAction(el);
  });
  document.addEventListener('click',function(e){
    const el=e.target.closest('[data-howto-act]');if(!el||el.disabled)return;
    const act=el.dataset.howtoAct;
    if(act==='open')openHowTo();
    else if(act==='skip')closeHowTo();
    else if(act==='prev')moveHowTo(-1);
    else if(act==='next')moveHowTo(1);
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'||!e.target.closest('#communicationHost'))return;
    if(e.target.id==='commTextInput'){
      e.preventDefault();
      const button=document.querySelector('#communicationHost [data-comm-act="sendText"]');
      if(button)handleCommunicationAction(button);
    }
  });
  document.addEventListener('keydown',function(e){
    if(!HOWTO_STATE.open)return;
    if(e.key==='Escape'){e.preventDefault();closeHowTo();}
    else if(e.key==='ArrowRight'){e.preventDefault();moveHowTo(1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();moveHowTo(-1);}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&STATE.ui.patientReview){e.preventDefault();STATE.ui.patientReview=null;saveLocalSession();render(true);}
  });
  window.addEventListener('resize',scheduleHowToPosition,{passive:true});
  window.addEventListener('scroll',scheduleHowToPosition,{passive:true,capture:true});
  const restored=restoreLocalSession();
  render(true);
  if(fbReady){
    fbSelfTest();
    if(restored&&STATE.me.name){identitySession+=1;armTwoDPositionDisconnect();startPolling();}
  }
}

boot();
})();

</script>
