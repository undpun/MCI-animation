  stopCommunicationListener();
  if(backgroundRenderTimer){clearTimeout(backgroundRenderTimer);backgroundRenderTimer=null;}
}
async function runDerivedStateMaintenance(){
  if(derivedBusy||!STATE.me.name||STATE.gc.status==='NOT_STARTED')return;
  derivedBusy=true;
  try{
    const elapsed=elapsedMinutes(STATE.gc);
    const controller=['GM','COMMANDER'].indexOf(STATE.me.station)>-1;
    if(controller&&STATE.gc.status==='RUNNING'&&STATE.gc.maxGameMin>0&&elapsed>=STATE.gc.maxGameMin){
      await kvSet(KEYS.gc,Object.assign({},STATE.gc,{status:'ENDED',endedElapsed:STATE.gc.maxGameMin,endedBy:'SYSTEM',debriefActive:true,debriefStartedAt:Date.now(),debriefStartedBy:'SYSTEM'}));
    }
    const hasEquipmentWork=equipmentRequests().some(function(r){return r.status==='APPROVED';});
    if(controller&&hasEquipmentWork)await resolveEquipmentLogistics(elapsed);
    const hasVehicleWorkflowWork=(STATE.vehicles||[]).some(function(v){return ['INCOMING','QUEUED_LOADING','HOSPITAL_TRIP'].indexOf(vehicleWorkflowState(v,elapsed))>-1;})||pendingVehicleRequests('LOADING_TO_PARKING').some(function(r){return !r.reservedVehicleId;});
    if(hasVehicleWorkflowWork)await resolveParkingLoadingWorkflow(elapsed);
    const assignedPorterJobs=Object.values((STATE.porters&&STATE.porters.jobs)||{}).filter(function(j){return j&&j.status==='assigned';});
    const stalePorterJob=assignedPorterJobs.sort(function(a,b){return porterAssignedAtMs(a)-porterAssignedAtMs(b);}).find(function(j){const at=porterAssignedAtMs(j);return at>0&&sharedNowMs()-at>=9000;});
    // Safety net: state progression must not depend on a player keeping the
    // source-zone iframe open. The normal visual callback finishes at ~5.6s;
    // after 9s any active client atomically completes an otherwise stuck job.
    if(stalePorterJob)await completePorterJob(stalePorterJob.id,{silent:true});
    const hasTimedPatient=STATE.patients.some(function(p){return p.stage==='TRANSIT'||p.stage==='HOSPITAL'||p.dischargePendingOutcome;});
    if(!hasTimedPatient)return;
    const result=await kvPatientsTransaction(function(patients){
      let next=resolveTransits(patients,elapsed);
      let changed=next.changed;
      let list=next.patients;
      next=resolveHospitalPatients(list,elapsed);changed=changed||next.changed;list=next.patients;
      next=resolveDischargedPatients(list,elapsed,STATE.cases);changed=changed||next.changed;list=next.patients;
      return changed?list:null;
    });
    if(result.committed)STATE.patients=result.patients;
  }finally{derivedBusy=false;}
}

let pollTimer=null;
let rosterHeartbeatTimer=null;
let clockTimer=null;
let derivedTimer=null;
let identitySession=0;
let lastCommunicationLifecycleCheck=0;

function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(rosterHeartbeatTimer){ clearInterval(rosterHeartbeatTimer); rosterHeartbeatTimer=null; }
  if(clockTimer){ clearInterval(clockTimer); clockTimer=null; }
  if(derivedTimer){ clearInterval(derivedTimer); derivedTimer=null; }
  stopRealtimeListeners();
}

function startPolling(){
  if(pollTimer||realtimeBindings.length) return;
  const session = identitySession;
  refreshAll().then(function(){
    if(session===identitySession)startRealtimeListeners(session);
  });
  // Realtime listeners reconnect themselves. This slow fallback only runs
  // after an observed connection error; it is not the normal sync path.
  pollTimer = setInterval(function(){if(STATE.fbConnected===false)refreshAll();},20000);
  rosterHeartbeatTimer = setInterval(function(){
    const activeName = STATE.me.name;
    if(!activeName || session!==identitySession) return;
    kvRosterUpdate(function(roster){
      if(session!==identitySession || STATE.me.name!==activeName) return roster;
      const cur = roster[activeName] || {station:null};
      const next = Object.assign({}, roster);
      next[activeName] = Object.assign({}, cur, {lastSeen:Date.now()});
      return next;
    });
    refreshMyPatientLocks();
    touchTwoDPosition();
    scheduleCommunicationHeadMaintenance(400);
  }, 15000);
  clockTimer = setInterval(function(){
    if(STATE.gc.status==='RUNNING'){
      updateLiveTimersOnly();
      updateTreatmentCountdownsOnly();
      updateFleetStatusOnly();
      updateExpiredLockVisualsOnly();
      updateSceneViewerPanel();
      if(Date.now()-lastCommunicationLifecycleCheck>=5000){lastCommunicationLifecycleCheck=Date.now();if(communicationHeadMaintenanceNeeded())scheduleCommunicationHeadMaintenance(50);}
    }
  }, 1000);
  derivedTimer=setInterval(runDerivedStateMaintenance,2000);
}

function participantMapCopy(raw){
  const out={};Object.keys(raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{}).forEach(function(name){const p=raw[name]||{};out[name]=Object.assign({},p,{history:(p.history||[]).slice()});});return out;
}
function gcWithParticipantEvent(gc,name,station,t,action,by){
  if(!name)return gc;
  const next=Object.assign({},gc),participants=participantMapCopy(gc&&gc.participants),current=participants[name]||{name:name,firstSeenAt:Number(t)||0,lastSeenAt:Number(t)||0,history:[]};
  const event={t:Number(t)||0,action:action||'JOIN',station:station||null,by:by||name};
  const history=(current.history||[]).slice(),last=history[history.length-1];
  if(!last||last.action!==event.action||last.station!==event.station||Math.abs(Number(last.t)-event.t)>.0001)history.push(event);
  participants[name]=Object.assign({},current,{name:name,firstSeenAt:Math.min(Number(current.firstSeenAt)||event.t,event.t),lastSeenAt:Math.max(Number(current.lastSeenAt)||0,event.t),lastStation:station||current.lastStation||null,history:history});
  next.participants=participants;return next;
}
function participantSeedFromRoster(roster){
  let gc={participants:{}};Object.keys(roster||{}).forEach(function(name){gc=gcWithParticipantEvent(gc,name,roster[name]&&roster[name].station,0,'START','SYSTEM');});return gc.participants;
}
async function joinAsPlayer(name, gender, asGM, asCommander, gmPassword){
  name = name.trim();
  gender=String(gender||'').toUpperCase()==='FEMALE'?'FEMALE':'MALE';
  if(!name) { toast('กรุณากรอกชื่อ','err'); return; }
  if(asGM && gmPassword!==GM_PASSWORD){
    toast('รหัส GM ไม่ถูกต้อง','err');
    const passwordInput = document.getElementById('joinGMPassword');
    if(passwordInput){ passwordInput.value=''; passwordInput.focus(); }
    return;
  }
  await ensureSeeded();
  const currentRoster = await kvGet(KEYS.roster, {});
  if(currentRoster[name] && currentRoster[name].station==='GM' && !asGM){
    toast('ชื่อนี้เป็น GM กรุณาเลือก “ฉันเป็นผู้ควบคุมเกม” และกรอกรหัส','err');
    return;
  }
  STATE.me.name = name;
  STATE.me.gender = gender;
  STATE.me.gmAuthorized = !!asGM;
  if(!STATE.me.clientId)STATE.me.clientId=makeClientId();
  identitySession += 1;
  let joinedStation=null;
  await kvRosterUpdate(function(roster){
    const cur = roster[name];
    const next = Object.assign({}, roster);
    joinedStation=asGM ? 'GM' : (asCommander ? 'COMMANDER' : (cur ? cur.station : null));
    next[name] = {station:joinedStation, gender:gender, lastSeen:Date.now()};
    return next;
  });
  await kvRootTransaction(function(root){const gc=root[KEYS.gc]||STATE.gc;if(gc.status==='RUNNING')root[KEYS.gc]=gcWithParticipantEvent(gc,name,joinedStation,elapsedMinutes(gc),'JOIN',name);return root;});
  saveLocalSession();
  armTwoDPositionDisconnect();
  startPolling();
}
async function gmAssignStation(name, stationId){
  if(transportCombined()&&stationId==='PARKING')stationId='LOADING';
  const elapsed=elapsedMinutes(STATE.gc);
  const previousRoster=STATE.roster,optimistic=Object.assign({},STATE.roster),current=optimistic[name]||{lastSeen:Date.now()};
  optimistic[name]=Object.assign({},current,{station:stationId||null});STATE.roster=optimistic;if(STATE.me.name===name)STATE.me.station=stationId||null;STATE._snapshot=null;render(true);
  let refunded=[];
  const result=await kvRootTransaction(function(root){
    const roster=root[KEYS.roster]||{};
    const cur=roster[name]||{lastSeen:Date.now()};
    const oldStation=cur.station||null;
    const next=Object.assign({},roster);
    next[name]=Object.assign({},cur,{station:stationId||null});
    root[KEYS.roster]=next;
    if(oldStation!==(stationId||null)){
      const gc=root[KEYS.gc]||STATE.gc;if(gc.status==='RUNNING')root[KEYS.gc]=gcWithParticipantEvent(gc,name,stationId||null,elapsed,'ASSIGN',STATE.me.name||'GM');
      refunded=cancelActiveTreatmentsAfterStaffDeparture(root,name,oldStation,elapsed);
      const locks=root[KEYS.locks]||{},nextLocks={};
      Object.keys(locks).forEach(function(id){if(!locks[id]||locks[id].ownerName!==name)nextLocks[id]=locks[id];});
      root[KEYS.locks]=nextLocks;
    }
    return root;
  });
  if(!result.committed){STATE.roster=previousRoster;applyRosterIdentity();toast('อัปเดตหน้าที่ไม่สำเร็จ','err');return false;}
  if(result.root&&result.root[KEYS.roster])STATE.roster=result.root[KEYS.roster];
  if(result.root&&result.root[KEYS.gc])STATE.gc=result.root[KEYS.gc];
  if(result.root&&result.root[KEYS.patients])STATE.patients=result.root[KEYS.patients];
  if(result.root&&result.root[KEYS.resources])STATE.resources=result.root[KEYS.resources];
  if(result.root&&result.root[KEYS.locks])STATE.locks=result.root[KEYS.locks];
  if(STATE.me.name===name) STATE.me.station = stationId||null;
  if(STATE.me.name===name)saveLocalSession();

  toast('อัปเดตหน้าที่ของ '+name+(refunded.length?' · ยกเลิก Treatment และคืน stock '+refunded.length+' รายการ':''), 'ok');
  return true;
}
async function gmRemovePlayer(name){

async function gmUpdateCase(id,caseObj){
  let found=false;
  const result=await kvCasesTransaction(function(cases){
    found=false;
    const index=cases.findIndex(function(c){return normU(c.id)===normU(id);});
    if(index<0)return null;
    found=true;
    const next=cases.slice();
    next[index]=Object.assign({},cases[index],caseObj,{id:cases[index].id});
    return next;
  });
  if(!result.committed){toast(found?'บันทึกการแก้ไขไม่สำเร็จ กรุณาลองใหม่':'ไม่พบเคส #'+id+' อาจถูกลบจากหน้าจออื่นแล้ว','err');return false;}

  toast('บันทึกการแก้ไขเคส #'+id+' แล้ว','ok');
  return true;

async function reserveResourceItem(item){
  if(!fbReady) return {ok:false, reason:'ไม่สามารถเชื่อมต่อฐานข้อมูลได้'};
  try{
    const ref=fbDb.ref(DB_ROOT+'/'+KEYS.resources);
    // Same caching issue as kvRootTransaction (see comment there): Firebase's
    // transaction() runs its update function against whatever is *locally
    // cached* for this exact path, which can be null if this client has never
    // read it directly. When that happens the function below aborts on a
    // false "โหลดข้อมูลทรัพยากรไม่สำเร็จ" without ever contacting the server.
    // Force a fresh read first so the transaction always starts from real data.
    await ref.once('value');
    let durationSec=5;
    let fail='';
    const result=await ref.transaction(function(raw){
      let list;
      try{ list=typeof raw==='string'?JSON.parse(raw):raw; }
      catch(e){ list=null; }
      // A previously seeded game can still have a missing `resources` child
      // (for example after importing/resetting an older save).  The UI uses
      // DEFAULT_RESOURCES as its fallback, so initialise the Firebase child
      // from the same defaults instead of aborting with a misleading load
      // error. If the server already has data, Firebase will rerun this
      // transaction with that current value before committing.
      if(list==null){
        list=DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
      }
      if(!Array.isArray(list)){ fail='รูปแบบข้อมูลทรัพยากรไม่ถูกต้อง กรุณาให้ GM Reset game'; return; }
      const ri=list.findIndex(function(r){return r.item===item;});
      if(ri<0){ fail='ไม่พบทรัพยากร '+item; return; }
      if(Number(list[ri].stock)<=0){ fail=item+' หมด กรุณาขอ GM เพิ่ม'; return; }
      durationSec=Number(list[ri].durationSec)||5;
      const next=list.slice();
      next[ri]=Object.assign({},list[ri],{stock:Number(list[ri].stock)-1});
      return JSON.stringify(next);
    });
    if(!result.committed) return {ok:false,reason:fail||'ไม่สามารถจองทรัพยากรได้'};
    const raw=result.snapshot.val();
    const list=typeof raw==='string'?JSON.parse(raw):raw;
    const resource=(list||[]).find(function(r){return r.item===item;});
    return {ok:true,durationSec:durationSec,stock:resource?Number(resource.stock):null};
  }catch(e){
    console.error('reserveResourceItem failed',e);
    return {ok:false,reason:(e&&e.message)||'เกิดข้อผิดพลาดในการจองทรัพยากร'};
  }
}

async function refundResourceItem(item){
  if(!fbReady) return;
  try{
    const ref=fbDb.ref(DB_ROOT+'/'+KEYS.resources);
    await ref.once('value'); // see note in reserveResourceItem
    await ref.transaction(function(raw){
      let list;
      try{ list=typeof raw==='string'?JSON.parse(raw):raw; }
      catch(e){ return; }
      if(!Array.isArray(list)) return;
      const ri=list.findIndex(function(r){return r.item===item;});
      if(ri<0) return;
      const next=list.slice();
      next[ri]=Object.assign({},list[ri],{stock:Number(list[ri].stock||0)+1});
      return JSON.stringify(next);
    });
  }catch(e){ console.error('refundResourceItem failed',e); }
}

function normalizePorterPool(porters){
  porters=(porters&&typeof porters==='object')?porters:{};
  const total=Math.max(0,Number(porters.total==null?10:porters.total)||0),jobs=Object.assign({},porters.jobs||{});
  const used=Object.values(jobs).filter(function(j){return j&&j.status==='assigned';}).length*2;
  return Object.assign({},porters,{total:total,deployed:Math.max(used,Math.min(total,Number(porters.deployed==null?0:porters.deployed)||0)),jobs:jobs});
}
function porterPoolUsed(porters){
  return Object.values((porters&&porters.jobs)||{}).filter(function(j){return j.status==='assigned';}).length*2;
}
function autoAssignPorterJobs(porters,elapsed,by){
  const next=normalizePorterPool(porters),jobs=Object.assign({},next.jobs),waiting=Object.keys(jobs).map(function(k){return Object.assign({id:k},jobs[k]);}).filter(function(j){return j.status==='requested';}).sort(function(a,b){return Number(a.requestedAtMs||0)-Number(b.requestedAtMs||0)||String(a.id).localeCompare(String(b.id));});
  let free=Math.max(0,Number(next.deployed||0)-porterPoolUsed(next));
  waiting.forEach(function(job){if(free<2)return;jobs[job.id]=Object.assign({},job,{status:'assigned',assignedBy:by||'SYSTEM',assignedAt:elapsed,assignedAtMs:sharedNowMs()});free-=2;});
  return Object.assign({},next,{jobs:jobs});
}
function porterAssignedAtMs(job){
  if(!job)return 0;
  if(Number(job.assignedAtMs||0)>0)return Number(job.assignedAtMs);
  return STATE.gc&&Number(STATE.gc.startTime||0)>0&&Number.isFinite(Number(job.assignedAt))?Number(STATE.gc.startTime)+Number(job.assignedAt)*60000:0;
}

async function pickupSupplyItem(zone,item){

  if(!clientId){toast('ไม่พบตัวตนผู้เล่น กรุณาเข้าเกมใหม่','err');return false;}
  let fail='',committedZoneResources=null,committedCarried=null;

    const resources=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
    const zoneResources=normalizeZoneResources(root[KEYS.zoneResources],resources);

    zoneResources[zone][item]=have-1;
    const nextCarried=Object.assign({},carried);
    nextCarried[clientId]=myInventory;
    nextCarried[clientId][item]=Number(nextCarried[clientId][item]||0)+1;

    committedZoneResources=zoneResources; committedCarried=nextCarried;

  let fail='',committedCarried=null,committedGc=null;
  const result=await kvRootTransaction(function(root){
    const resources=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
    const carried=(root[KEYS.carried]&&typeof root[KEYS.carried]==='object')?root[KEYS.carried]:{};
    const mine=Object.assign({},carried[senderClientId]||{}),theirs=Object.assign({},carried[recipientClientId]||{});
    if(Number(mine[item]||0)<=0){fail='คุณไม่ได้ถือ '+item+' อยู่';return null;}
    const itemUnits=resourceWeightUnits(item,resources),receiverUsed=carriedInventoryUnits(theirs,resources);
    if(receiverUsed+itemUnits>PLAYER_BAG_CAPACITY){fail='กระเป๋าของ '+(recipient.name||'ผู้รับ')+' เหลือ '+Math.max(0,PLAYER_BAG_CAPACITY-receiverUsed)+' หน่วย รับ '+item+' ไม่พอ';return null;}
    mine[item]=Number(mine[item]||0)-1;if(mine[item]<=0)delete mine[item];
    theirs[item]=Number(theirs[item]||0)+1;
    const nextCarried=Object.assign({},carried);nextCarried[senderClientId]=mine;nextCarried[recipientClientId]=theirs;
    const gc=Object.assign({},root[KEYS.gc]||STATE.gc),elapsed=elapsedMinutes(gc);
    gc.operationsLog=(gc.operationsLog||[]).concat([{t:elapsed,type:'BAG_TRANSFER '+item+' TO '+(recipient.name||recipientClientId),by:STATE.me.name||''}]);
    root[KEYS.carried]=nextCarried;root[KEYS.gc]=gc;committedCarried=nextCarried;committedGc=gc;return root;
  });
  if(!result.committed)return {ok:false,message:fail||'ส่งของให้เพื่อนไม่สำเร็จ'};
  STATE.carried=committedCarried;if(committedGc)STATE.gc=committedGc;render(true);
  return {ok:true,message:'ส่ง '+item+' ให้ '+(recipient.name||'ผู้เล่น')+' แล้ว'};
}

async function txMoveZone(id,toColor){
  if(!canEditLockedPatient(id))return;
  toColor=String(toColor||'').toUpperCase();
  if(TX_ZONES.indexOf(toColor)<0)return;
  const elapsed=elapsedMinutes(STATE.gc);
  const beforeP=STATE.patients.find(function(p){return normU(p.id)===normU(id);});
  const wasMobile=beforeP&&effectiveCanWalk(beforeP)==='yes';
  if(beforeP&&effectiveCanWalk(beforeP)!=='yes'){
    if(beforeP.stage!=='TX'){toast('ผู้ป่วยไม่ได้อยู่ใน Treatment zone','err');return;}
    if(hasAnyTxInProgress(beforeP,elapsed)){toast('Treatment ยังไม่เสร็จ','err');return;}
    if(beforeP.txZone===toColor)return;
    if(txActiveBedsUsed(STATE.patients,toColor)>=ACTIVE_TX_BEDS){toast('เตียง '+toColor+' Treatment เต็ม','err');return;}
    const requested=await requestPorterJob(id,'TX_'+beforeP.txZone,'TX_'+toColor);
    if(requested){await releasePatientLocks([id]);setFocusedPatient(STATE.me.station,null);STATE.ui.twoD.panelMinimized=true;saveLocalSession();render(true);}
    return;
  }
  const saved=await mutatePatients(function(patients){
    const idx=patients.findIndex(function(p){return normU(p.id)===normU(id);});if(idx<0)return null;
    const p=patients[idx];
    if(p.stage!=='TX'){toast('ผู้ป่วยไม่ได้อยู่ใน Treatment zone','err');return null;}
    if(hasAnyTxInProgress(p,elapsed)){toast('Treatment ยังไม่เสร็จ','err');return null;}
    if(p.txZone===toColor){return null;}
    if(txActiveBedsUsed(patients,toColor)>=ACTIVE_TX_BEDS){toast('เตียง '+toColor+' Treatment เต็ม','err');return null;}
    const next=Object.assign({},p,{txZone:toColor,events:(p.events||[]).concat([{t:elapsed,type:'TX_MOVE_ZONE '+p.txZone+'→'+toColor,by:STATE.me.name||''}])});
    const copy=patients.slice();copy[idx]=next;return copy;
  });
  if(saved){if(wasMobile)twoDFramePost('txExit',{id:id});await releasePatientLocks([id]);setFocusedPatient(STATE.me.station,null);render(true);}
}

async function txStartItem(id, slotIndex, item, location){
  if(!item) return;
  id=normU(id);
  if(!canEditLockedPatient(id))return;
  if(pendingTxTextSaves[id])await pendingTxTextSaves[id].catch(function(){});
  slotIndex=Number(slotIndex);
  location=location||'TX';
  const elapsed=elapsedMinutes(STATE.gc);

  // ตรวจสอบผู้ป่วยและกำลังคนก่อน แล้วจอง stock ด้วย Firebase transaction
  // เพื่อป้องกันผู้เล่นหลายคนใช้ทรัพยากรชิ้นสุดท้ายพร้อมกัน
  const patients=await kvGet(KEYS.patients,[]);
  const idx=patients.findIndex(function(p){return normU(p.id)===id;});
  if(idx<0){toast('ไม่พบผู้ป่วย #'+id,'err');return;}

  const p=patients[idx];
  const caseObj=findCase(STATE.cases,id);
  const inTriage=location==='PRIMARY'||location==='SECONDARY';
  if(inTriage&&p.stage!==location){toast('ผู้ป่วยไม่ได้อยู่ใน '+location+' Triage','err');return;}
  if(!inTriage&&p.stage!=='TX'){toast('ผู้ป่วยไม่ได้อยู่ใน Treatment zone','err');return;}
  if(computeTxStatus(p,caseObj,elapsed)==='DEAD'){
    toast('ผู้ป่วยเสียชีวิตแล้วและต้องค้างใน Treatment','err');return;
  }
  if(!canStartSequential(p,slotIndex,elapsed)){
    toast('ต้องเริ่ม Treatment ลำดับก่อนหน้าก่อน','err');return;
  }
  if(inTriage&&hasAnyTxInProgress(p,elapsed)){
    toast('มี Treatment กำลังดำเนินการอยู่','err');return;
  }

  const selectedResource=STATE.resources.find(function(r){return r.item===item;});
  if(inTriage&&!resourceTriageAllowed(selectedResource)){
    toast(item+' ไม่ได้รับอนุญาตให้ทำใน Triage','err');return;
  }
  const capacity=inTriage?triageStaffCount(location):treatmentStaffCount(p.txZone);
  const inProgress=inTriage?countTriageTreatmentInProgress(patients,location,elapsed):countZoneInProgress(patients,p.txZone,elapsed);
  if(capacity<=0||inProgress>=capacity){
    toast('ไม่มี Staff ว่างในโซน '+(inTriage?location+' Triage':p.txZone)+' ('+inProgress+'/'+capacity+')','err');return;
  }

  // Commit the patient timer and stock deduction together. This prevents a
  // partial save and also prevents two players taking the final item.
  let fail='';
  let committedPatients=null;
  let committedResources=null;
  let committedZoneResources=null;
  let committedCarried=null;
  const myClientId=STATE.me.clientId;
  const result=await kvRootTransaction(function(root){
    const livePatients=Array.isArray(root[KEYS.patients])?root[KEYS.patients]:[];
    const liveResources=Array.isArray(root[KEYS.resources])
      ? root[KEYS.resources]
      : DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
    const liveRoster=root[KEYS.roster]||STATE.roster||{};
    const liveGc=root[KEYS.gc]||STATE.gc||DEFAULT_GC;
    const liveZoneResources=normalizeZoneResources(root[KEYS.zoneResources],liveResources);
    const liveCarried=(root[KEYS.carried]&&typeof root[KEYS.carried]==='object')?root[KEYS.carried]:{};
    const pi=livePatients.findIndex(function(x){return normU(x.id)===id;});
    if(pi<0){fail='ไม่พบผู้ป่วย #'+id;return null;}
    const liveP=livePatients[pi];
    if(inTriage&&liveP.stage!==location){fail='ผู้ป่วยไม่ได้อยู่ใน '+location+' Triage';return null;}
    if(!inTriage&&liveP.stage!=='TX'){fail='ผู้ป่วยไม่ได้อยู่ใน Treatment zone';return null;}
    if(computeTxStatus(liveP,caseObj,elapsed)==='DEAD'){fail='ผู้ป่วยเสียชีวิตแล้วและต้องค้างใน Treatment';return null;}
    if(!canStartSequential(liveP,slotIndex,elapsed)){fail='ต้องเริ่ม Treatment ลำดับก่อนหน้าก่อน';return null;}
    if(inTriage&&hasAnyTxInProgress(liveP,elapsed)){fail='มี Treatment กำลังดำเนินการอยู่';return null;}
    const ri=liveResources.findIndex(function(r){return r.item===item;});
    if(ri<0){fail='ไม่พบทรัพยากร '+item;return null;}
    if(inTriage&&!resourceTriageAllowed(liveResources[ri])){fail=item+' ไม่ได้รับอนุญาตให้ทำใน Triage';return null;}
    if(Number(liveResources[ri].stock)<=0){fail=item+' หมด กรุณาขอ GM เพิ่ม';return null;}
    const resourceZone=treatmentZoneKey(location,liveP);
    let myCarried=null;
    if(inTriage){
      if(Number(liveZoneResources[resourceZone]&&liveZoneResources[resourceZone][item]||0)<=0){fail=item+' หมดในโซน '+resourceZone.replace('TX_','')+' — กรุณาขอเพิ่ม';return null;}
    }else{
      if(!myClientId){fail='ไม่พบตัวตนผู้เล่น กรุณาเข้าเกมใหม่';return null;}
      myCarried=Object.assign({},liveCarried[myClientId]||{});
      if(Number(myCarried[item]||0)<=0){fail='คุณไม่ได้ถือ '+item+' อยู่ — ต้องไปหยิบจากตู้ Supply ก่อน';return null;}
    }

    const liveCapacity=inTriage?triageStaffCount(location,liveRoster):treatmentStaffCount(liveP.txZone,liveRoster);
    const liveInProgress=inTriage?countTriageTreatmentInProgress(livePatients,location,elapsed):countZoneInProgress(livePatients,liveP.txZone,elapsed);
    if(liveCapacity<=0||liveInProgress>=liveCapacity){fail='ไม่มี Staff ว่างในโซน '+(inTriage?location+' Triage':liveP.txZone)+' ('+liveInProgress+'/'+liveCapacity+')';return null;}

    const durationSec=effectiveTreatmentDurationSec(liveResources[ri],liveGc);
    const tx=(liveP.tx||Array(TX_SLOT_COUNT).fill(null)).slice();
    if(tx[slotIndex]){fail='Treatment ลำดับนี้ถูกเริ่มจากหน้าจออื่นแล้ว';return null;}
    tx[slotIndex]=inTriage
      ?{item:item,startedAt:elapsed,durationSec:durationSec,location:location,resourceZone:resourceZone,staffName:STATE.me.name||null}
      :{item:item,startedAt:elapsed,durationSec:durationSec,location:location,resourceZone:resourceZone,staffName:STATE.me.name||null,carriedByClientId:myClientId};
    const nextPatients=livePatients.slice();
    nextPatients[pi]=Object.assign({},liveP,{
      tx:tx,
      firstTreatmentTime:liveP.firstTreatmentTime==null?elapsed:liveP.firstTreatmentTime,
      txStartTime:location==='TX'&&liveP.txStartTime==null?elapsed:liveP.txStartTime,
      events:(liveP.events||[]).concat([{t:elapsed,type:(inTriage?'TRIAGE_TX_START '+location+' ':'TX_START ')+item,by:STATE.me.name||''}])
    });
    const nextResources=liveResources.slice();
    nextResources[ri]=Object.assign({},liveResources[ri],{stock:Number(liveResources[ri].stock)-1});
    root[KEYS.patients]=nextPatients;
    root[KEYS.resources]=nextResources;
    committedPatients=nextPatients;
    committedResources=nextResources;
    if(inTriage){
      liveZoneResources[resourceZone][item]=Number(liveZoneResources[resourceZone][item]||0)-1;
      root[KEYS.zoneResources]=liveZoneResources;
      committedZoneResources=liveZoneResources;
    }else{
      myCarried[item]=Number(myCarried[item]||0)-1;
      const nextCarried=Object.assign({},liveCarried);nextCarried[myClientId]=myCarried;
      root[KEYS.carried]=nextCarried;
      committedCarried=nextCarried;
    }
    return root;
  });
  if(!result.committed){
    toast(fail||'เริ่ม Treatment ไม่สำเร็จ กรุณาลองอีกครั้ง','err');
    await refreshAll();
    return;
  }

  STATE.patients=committedPatients;
  STATE.resources=committedResources;
  if(committedZoneResources)STATE.zoneResources=committedZoneResources;
  if(committedCarried)STATE.carried=committedCarried;
  render();
}

async function txCancelItem(id,slotIndex){
  id=normU(id); slotIndex=Number(slotIndex);
  if(!canEditLockedPatient(id))return;
  const elapsed=elapsedMinutes(STATE.gc);
  let fail='',cancelledItem='',committedPatients=null,committedResources=null,committedZoneResources=null,committedCarried=null;
  const result=await kvRootTransaction(function(root){
    const patients=Array.isArray(root[KEYS.patients])?root[KEYS.patients]:[];
    const resources=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
    const zoneResources=normalizeZoneResources(root[KEYS.zoneResources],resources);
    const carried=(root[KEYS.carried]&&typeof root[KEYS.carried]==='object')?root[KEYS.carried]:{};
    const roster=root[KEYS.roster]||STATE.roster||{};
    const pi=patients.findIndex(function(p){return normU(p.id)===id;});
    if(pi<0){fail='ไม่พบผู้ป่วย #'+id;return null;}
    const p=patients[pi];
    if(['PRIMARY','SECONDARY','TX'].indexOf(p.stage)<0){fail='ยกเลิกได้เฉพาะขณะผู้ป่วยยังอยู่ใน Triage หรือ Treatment';return null;}
    if(patientIsDead(p,elapsed)){fail='ผู้ป่วยเสียชีวิตแล้ว ไม่สามารถเปลี่ยน Treatment ได้';return null;}
    const tx=(p.tx||[]).slice();
    const slot=tx[slotIndex];
    if(!slot){fail='ไม่พบ Treatment ที่ต้องการยกเลิก';return null;}
    const requiredStation=treatmentStationForSlot(p,slot);
    const actingStation=roster[STATE.me.name]&&roster[STATE.me.name].station;
    if(actingStation!=='GM'&&actingStation!==requiredStation){fail='ต้องอยู่ใน Zone ที่ทำ Treatment นี้จึงจะยกเลิกได้';return null;}
    const ri=resources.findIndex(function(r){return r.item===slot.item;});
    if(ri<0){fail='ไม่พบทรัพยากร '+slot.item;return null;}
    cancelledItem=slot.item;
    tx.splice(slotIndex,1);
    const nextPatients=patients.slice();
    nextPatients[pi]=Object.assign({},p,{tx:compactTreatmentSlots(tx),events:(p.events||[]).concat([{t:elapsed,type:'TX_CANCEL '+slot.item,by:STATE.me.name||''}])});
    const nextResources=resources.slice();
    nextResources[ri]=Object.assign({},resources[ri],{stock:Number(resources[ri].stock||0)+1});
    root[KEYS.patients]=nextPatients; root[KEYS.resources]=nextResources;
    committedPatients=nextPatients; committedResources=nextResources;
    if(slot.location==='TX'&&slot.carriedByClientId){
      const nextCarried=Object.assign({},carried);
      nextCarried[slot.carriedByClientId]=Object.assign({},nextCarried[slot.carriedByClientId]||{});
      const itemUnits=resourceWeightUnits(slot.item,resources),usedUnits=carriedInventoryUnits(nextCarried[slot.carriedByClientId],resources);
      if(usedUnits+itemUnits<=PLAYER_BAG_CAPACITY){
        nextCarried[slot.carriedByClientId][slot.item]=Number(nextCarried[slot.carriedByClientId][slot.item]||0)+1;
        root[KEYS.carried]=nextCarried; committedCarried=nextCarried;
      }else{
        const refundZone=slot.resourceZone||treatmentZoneKey(slot.location,p);
        if(zoneResources[refundZone])zoneResources[refundZone][slot.item]=Number(zoneResources[refundZone][slot.item]||0)+1;
        root[KEYS.zoneResources]=zoneResources;committedZoneResources=zoneResources;
      }
    }else{
      const refundZone=slot.resourceZone||treatmentZoneKey(slot.location,p);
      if(zoneResources[refundZone])zoneResources[refundZone][slot.item]=Number(zoneResources[refundZone][slot.item]||0)+1;
      root[KEYS.zoneResources]=zoneResources; committedZoneResources=zoneResources;
    }
    return root;
  });
  if(!result.committed){toast(fail||'ยกเลิก Treatment ไม่สำเร็จ','err');return;}
  STATE.patients=committedPatients; STATE.resources=committedResources;
  if(committedZoneResources)STATE.zoneResources=committedZoneResources;
  if(committedCarried)STATE.carried=committedCarried;
  render();
}

async function txSetDispo(id, dispo){
  if(!canEditLockedPatient(id))return;
  const elapsed=elapsedMinutes(STATE.gc);
  const beforeP=STATE.patients.find(function(p){return normU(p.id)===normU(id);});
  const wasMobile=beforeP&&effectiveCanWalk(beforeP)==='yes';
  if(beforeP&&effectiveCanWalk(beforeP)!=='yes'){
    if(beforeP.stage!=='TX'){toast('ผู้ป่วยไม่ได้อยู่ใน Treatment zone','err');return;}
    const status=computeTxStatus(beforeP,findCase(STATE.cases,id),elapsed);
    if(status==='DEAD'){toast('ผู้ป่วยเสียชีวิตแล้วและต้องค้างใน Treatment','err');return;}
    if(hasAnyTxInProgress(beforeP,elapsed)){toast('Treatment ยังไม่เสร็จ','err');return;}
    const target=dispo==='TRANSFER'?'LOADING':'DISCHARGE';
    const requested=await requestPorterJob(id,'TX_'+beforeP.txZone,target);
    if(requested){await releasePatientLocks([id]);setFocusedPatient(STATE.me.station,null);STATE.ui.twoD.panelMinimized=true;saveLocalSession();render(true);}
    return;
  }
  const saved=await mutatePatients(function(patients){
    const idx=patients.findIndex(function(p){return normU(p.id)===normU(id);});if(idx<0)return null;
    const p=patients[idx], status=computeTxStatus(p,findCase(STATE.cases,id),elapsed);
    if(status==='DEAD'){toast('ผู้ป่วยเสียชีวิตแล้วและต้องค้างใน Treatment','err');return null;}
    if(hasAnyTxInProgress(p,elapsed)){toast('Treatment ยังไม่เสร็จ','err');return null;}
    // Deliberately NOT blocking on whether required tx were completed correctly/in
    // time — that must stay hidden from players. Missing required treatments may
    // still be completed by the virtual hospital after travel time has elapsed.
    let next;
    if(dispo==='TRANSFER') next=Object.assign({},p,{dispo:'TRANSFER',transferOrder:maxOrder(patients,'transferOrder')+1,transferArrivalTime:elapsed,stage:'TRANSFER',events:(p.events||[]).concat([{t:elapsed,type:'TO_TRANSFER',by:STATE.me.name||''}])});
    else next=Object.assign({},p,{dispo:'DISCHARGE',stage:'CLOSED',dischargeTime:elapsed,events:(p.events||[]).concat([{t:elapsed,type:'DISCHARGE_TX',by:STATE.me.name||''}])},dischargeOutcomeFields(p,findCase(STATE.cases,p.id),elapsed,'DISCHARGE_TX'));
    const copy=patients.slice();copy[idx]=next;
    // A bed just freed up in this color — auto-pull the longest-waiting Secondary
    // patient held for the same color, same as porters fetching them in person.
    const freedColor=p.txZone;
    const waiting=copy.filter(function(x){return x.stage==='SECONDARY'&&x.txHoldZone===freedColor;}).sort(function(a,b){return Number(a.secondaryOrder||0)-Number(b.secondaryOrder||0);});
    if(waiting.length){
      const w=waiting[0],wi=copy.findIndex(function(x){return normU(x.id)===normU(w.id);});
      const zoneTentType=TX_ZONE_TENT_TYPE[freedColor]||'red';
      const durMin=transitMinutes('secondary',zoneTentType,effectiveCanWalk(w),'distTreatment');
      copy[wi]=Object.assign({},w,{txHoldZone:null,stage:'TRANSIT',transit:{fromStage:'SECONDARY',toStage:'TX',txZone:freedColor,startElapsed:elapsed,arriveElapsed:elapsed+durMin},events:(w.events||[]).concat([{t:elapsed,type:'TX_HOLD_RELEASE '+freedColor,by:'AUTO'}])});
    }
    return copy;
  });
  if(saved&&STATE.me.station&&STATE.me.station.indexOf('TX_')===0){
    if(dispo==='TRANSFER'&&wasMobile)twoDFramePost('txExit',{id:id});
    await releasePatientLocks([id]);setFocusedPatient(STATE.me.station,null);render(true);
  }
}

============================================================ */
async function transferAssign(id, field, value){
  if(!canEditLockedPatient(id))return;
  const elapsed=elapsedMinutes(STATE.gc);
  await mutatePatients(function(patients){
    const selected=patients.find(function(p){return normU(p.id)===normU(id);});
    if(!selected)return null;
    if(selected.stage!=='TRANSFER'){toast('ผู้ป่วยไม่ได้อยู่ใน Transfer','err');return null;}
    if(patientIsDead(selected,elapsed)){toast('ผู้ป่วยเสียชีวิตแล้ว ไม่สามารถเลือกรถหรือโรงพยาบาลได้','err');return null;}
    return patients.map(function(p){
      if(normU(p.id)!==normU(id))return p;
      const patch=mkPatch(field,value);
      const label=field==='hospital'?'HOSPITAL_SELECTED ':field==='vehicle'?'VEHICLE_SELECTED ':'TRANSFER_SET '+field+' ';
      patch.events=(p.events||[]).concat([{t:elapsed,type:label+(value||'—'),by:STATE.me.name||''}]);
      return Object.assign({},p,patch);
    });
  });
}
const pendingTxTextSaves={};
async function saveTxTextQuiet(id,field,value,errorLabel){
  id=normU(id);
  const previous=pendingTxTextSaves[id]||Promise.resolve();
  const task=previous.catch(function(){}).then(function(){
    return kvPatientsTransaction(function(patients){
      return patients.map(function(p){const patch={};patch[field]=value;return normU(p.id)===id?Object.assign({},p,patch):p;});
    });
  });
  pendingTxTextSaves[id]=task;
  const result=await task;
  if(pendingTxTextSaves[id]===task)delete pendingTxTextSaves[id];
  if(!result.committed){toast(errorLabel,'err');return false;}
  STATE.patients=result.patients;
  return true;
}
async function txSetNote(id, value){
  if(!canEditLockedPatient(id))return;
  await saveTxTextQuiet(id,'txNote',value,'บันทึก Handoff Note ไม่สำเร็จ');
}
async function txSetDx(id, value){
  if(!canEditLockedPatient(id))return;
  await saveTxTextQuiet(id,'dx',value,'บันทึก Diagnosis ไม่สำเร็จ');
}

   13) DISPATCH ACTION
============================================================ */
async function dispatchSend(vehicleName,selectedIds,selectedHospital,suppressRender,options){
  vehicleName=norm(vehicleName);
  options=options||{};
  const explicitSelection=Array.isArray(selectedIds);
  const requireExplicitLocks=explicitSelection&&!options.twoD;
  const dispatchRequestId=norm(options.requestId||'');
  const wantedIds=explicitSelection?uniq(selectedIds.map(normU).filter(Boolean)):[];
  if(!vehicleName){toast('เลือกรถก่อน','err');return false;}
  if(explicitSelection&&!wantedIds.length){toast('เลือกผู้ป่วยอย่างน้อย 1 คน','err');return false;}
  const elapsed=elapsedMinutes(STATE.gc);
  const lockNow=Date.now();
  let fail='';
  let summary=null;
  let duplicateSuccess=false;
  const result=await kvRootTransaction(function(root){
    fail='';summary=null;
    const vehicles=Array.isArray(root[KEYS.vehicles])?root[KEYS.vehicles]:DEFAULT_VEHICLES.slice();
    const patients=Array.isArray(root[KEYS.patients])?root[KEYS.patients]:[];
    const hospitals=Array.isArray(root[KEYS.hospitals])?root[KEYS.hospitals]:DEFAULT_HOSPITALS.slice();
    const casesNow=Array.isArray(root[KEYS.cases])?root[KEYS.cases]:STATE.cases;
    const resourcesNow=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:STATE.resources;
    const gcNow=root[KEYS.gc]||STATE.gc;
    const locksNow=root[KEYS.locks]||{};
    const vehicle=vehicles.find(function(v){return v.name===vehicleName;});
    if(!vehicle){fail='ไม่พบรถ '+vehicleName;return null;}
    if(dispatchRequestId&&vehicle.lastDispatchRequestId===dispatchRequestId){duplicateSuccess=true;return null;}
    if(vehicleEffectiveStatus(vehicle,elapsed)!=='AVAILABLE'){fail='รถยังไม่ว่าง';return null;}
    if(vehicleWorkflowState(vehicle,elapsed)!=='LOADING_BAY'){fail='รถไม่ได้อยู่หน้า Loading Bay';return null;}
    if(requireExplicitLocks){
      const selectedVehicleLock=locksNow[vehicleLockKey(vehicleName)];
      if(!patientLockIsActive(selectedVehicleLock,lockNow)||!patientLockOwnedByMe(selectedVehicleLock)){fail='รถ '+vehicleName+' ถูกเลือกจากหน้าจออื่นหรือสิทธิ์หมดอายุ กรุณาเลือกรถใหม่';return null;}
    }

    let assigned;
    if(explicitSelection){
      if(options.twoD){
        assigned=patients.filter(function(p){return p.stage==='TRANSFER'&&p.boardedVehicle===vehicleName&&p.boardedAtMs&&wantedIds.indexOf(normU(p.id))>-1;});
        if(assigned.length!==wantedIds.length){fail='ผู้ป่วยบางคนยังไม่ได้ขึ้นรถจริง';return null;}
      }else{
      const unavailable=wantedIds.find(function(id){
        const lock=locksNow[id];
        return !patientLockIsActive(lock,lockNow)||!patientLockOwnedByMe(lock);
      });
      if(unavailable){fail='สิทธิ์จัดผู้ป่วย No. '+unavailable+' หมดอายุหรือถูกใช้งานจากหน้าจออื่น กรุณาเลือกใหม่';return null;}
      assigned=patients.filter(function(p){return p.stage==='TRANSFER'&&wantedIds.indexOf(normU(p.id))>-1;});
      if(assigned.length!==wantedIds.length){fail='ผู้ป่วยบางคนถูกย้ายออกจาก Transfer แล้ว กรุณาเลือกใหม่';return null;}
      }
    }else{
      assigned=patients.filter(function(p){return p.stage==='TRANSFER'&&p.vehicle===vehicleName;});
    }
    if(!assigned.length){fail='ไม่มีผู้ป่วยที่เลือกสำหรับรถคันนี้';return null;}
    if(assigned.some(function(p){return patientIsDead(p,elapsed);})){fail='มีผู้ป่วยที่ไม่สามารถส่งต่อได้ กรุณาเลือกใหม่';return null;}

    const hospitalsList=explicitSelection?[selectedHospital].filter(Boolean):uniq(assigned.map(function(p){return p.hospital;}).filter(Boolean));
    if(hospitalsList.length===0){fail='ยังไม่ได้กำหนดโรงพยาบาลปลายทาง';return null;}
    if(hospitalsList.length>1){fail='ผู้ป่วยบนรถปลายทางไม่ตรงกัน (Mixed hospital)';return null;}
    const hospital=hospitalsList[0];
    const hCapacity=hospitals.find(function(h){return h.name===hospital;});
    if(!hCapacity){fail='ไม่พบโรงพยาบาลปลายทาง';return null;}
    const type=normU(vehicle.type||vehicleType(vehicleName));
    const sitting=assigned.filter(function(p){return effectiveCanWalk(p)==='yes';}).length;
    const lying=assigned.length-sitting;
    const load=calcVehicleLoad(type,assigned.length,sitting,lying,1);
    if(!load.ok){fail='โหลดเกินกำหนด: '+load.label;return null;}

    const ms=Object.assign({},DEFAULT_GC.mapSettings,gcNow.mapSettings||{});
    const manualOutbound=Number(hCapacity.outboundMin!=null?hCapacity.outboundMin:hCapacity.distanceMin)||5;
    const manualReturn=Number(hCapacity.returnMin!=null?hCapacity.returnMin:hCapacity.distanceMin)||manualOutbound;
    const sceneTimes=(ms.useMap&&ms.distTransfer)?sceneRouteTravelTimes(hospital):null;
    const outboundMin=!ms.useMap?manualOutbound:(!ms.distTransfer?0:(sceneTimes?sceneTimes.outboundMin:manualOutbound));
    let returnMin=!ms.useMap?manualReturn:(!ms.distTransfer?0:(sceneTimes?sceneTimes.returnMin:manualReturn));
    const outboundPath=(sceneTimes&&sceneTimes.outboundPath)||[];
    let returnPath=(sceneTimes&&sceneTimes.returnPath)||[];
    if(ms.useMap&&ms.distTransfer){
      const returnTent=sceneTent(((gcNow.transportMode||'SPLIT')==='COMBINED')?'loading':'parking'),hospitalTent=(STATE.scene&&STATE.scene.data&&STATE.scene.data.tents||[]).find(function(t){return t.typeId==='hospital'&&(t.name===hospital||t.linkedHospitalName===hospital);});
      if(returnPath.length>1&&returnTent)returnPath=appendRouteEndpoint(returnPath,returnTent);
      else if(returnTent&&hospitalTent){returnMin=(haversineKm(hospitalTent.lat,hospitalTent.lng,returnTent.lat,returnTent.lng)/AMBULANCE_FALLBACK_KMH)*60;returnPath=[{lat:hospitalTent.lat,lng:hospitalTent.lng},{lat:returnTent.lat,lng:returnTent.lng}];}
    }
    const arrivalAt=elapsed+outboundMin;
    const transportHarmAt=elapsed+outboundMin/2;
    const allowHospitalTreatment=hospitalTreatmentEnabled(gcNow);
    const assignedKeys={};assigned.forEach(function(p){assignedKeys[normU(p.id)]=true;});
    const capacityKeys={};
    const projected={RED:Number(hCapacity.redUsed||0),YELLOW:Number(hCapacity.yellowUsed||0),GREEN:Number(hCapacity.greenUsed||0)};
    let sentCount=0,mismatchCount=0,acceptedCount=0,deadCount=0;

    const nextPatients=patients.map(function(p){
      if(p.stage!=='TRANSFER'||!assignedKeys[normU(p.id)])return p;
      const base=Object.assign({},p,{vehicle:vehicleName,hospital:hospital});
      const caseObj=findCase(casesNow,p.id);
      const requiredVehicle=requiredVehicleFor(caseObj);
      const wrongVehicle=requiredVehicle&&type!==normU(requiredVehicle);
      sentCount++;
      if(wrongVehicle){
        mismatchCount++;
        return Object.assign({},base,{
          stage:'HOSPITAL',transferStatus:'IN_TRANSIT_TO_HOSPITAL',closedReason:null,transferTime:elapsed,
          hospitalPlannedArrivalTime:arrivalAt,hospitalArrivalTime:null,hospitalTx:[],
          hospitalCare:{dispatchedAt:elapsed,arrivalAt:arrivalAt,treatmentCompleteAt:arrivalAt,outcomeAt:transportHarmAt,willSurvive:false,transportHarm:true},
          hospitalOutcome:null,transportMismatch:true,requiredVehicle:requiredVehicle||null,overCapacity:false,
          events:(p.events||[]).concat([{t:elapsed,type:'DISPATCH '+vehicleName+' → '+hospital+' (DO HARM: WRONG VEHICLE)',by:STATE.me.name||''}])
        });
      }
      if(!allowHospitalTreatment){
        const txComplete=requiredTxComplete(p,caseObj,elapsed);
        let transferStatus,closedReason;
        if(!txComplete){transferStatus='DEAD_TX_INCOMPLETE';closedReason='DEAD_TX_INCOMPLETE';deadCount++;}
        else{transferStatus='ACCEPTED';closedReason='TRANSFER_ACCEPTED';acceptedCount++;capacityKeys[normU(p.id)]=true;}
        const color=p.secondary||'';
        let overCapacity=false;
        if(closedReason==='TRANSFER_ACCEPTED'&&projected[color]!=null){
          projected[color]++;
          const cap=color==='RED'?hCapacity.redCap:color==='YELLOW'?hCapacity.yellowCap:hCapacity.greenCap;
          overCapacity=projected[color]>Number(cap||0);
        }
        return Object.assign({},base,{
          stage:'CLOSED',transferStatus:transferStatus,closedReason:closedReason,transferTime:elapsed,
          hospitalTx:[],hospitalCare:null,hospitalOutcome:null,hospitalArrivalTime:null,hospitalPlannedArrivalTime:null,
          transportMismatch:false,requiredVehicle:requiredVehicle||null,overCapacity:overCapacity,
          events:(p.events||[]).concat([{t:elapsed,type:'DISPATCH '+vehicleName+' → '+hospital+' (LEGACY)',by:STATE.me.name||''}])
        });
      }
      const hospitalTx=buildHospitalTreatmentPlan(p,caseObj,arrivalAt,resourcesNow,gcNow,elapsed);
      const treatmentCompleteAt=hospitalTx.length?hospitalTx[hospitalTx.length-1].startedAt+hospitalTx[hospitalTx.length-1].durationSec/60:arrivalAt;
      const willSurvive=hospitalPlanWillSucceed(p,caseObj,hospitalTx);
      const limit=Number(caseObj&&caseObj.timeLimit)||999;
      const outcomeAt=willSurvive?treatmentCompleteAt:Math.max(elapsed,Math.min(treatmentCompleteAt,limit));
      capacityKeys[normU(p.id)]=true;
      const color=p.secondary||'';
      let overCapacity=false;
      if(projected[color]!=null){
        projected[color]++;
        const cap=color==='RED'?hCapacity.redCap:color==='YELLOW'?hCapacity.yellowCap:hCapacity.greenCap;
        overCapacity=projected[color]>Number(cap||0);
      }
      return Object.assign({},base,{
        stage:'HOSPITAL',transferStatus:'IN_TRANSIT_TO_HOSPITAL',closedReason:null,transferTime:elapsed,
        hospitalPlannedArrivalTime:arrivalAt,hospitalArrivalTime:null,hospitalTx:hospitalTx,
        hospitalCare:{dispatchedAt:elapsed,arrivalAt:arrivalAt,treatmentCompleteAt:treatmentCompleteAt,outcomeAt:outcomeAt,willSurvive:willSurvive,transportHarm:false},
        transportMismatch:false,requiredVehicle:requiredVehicle||null,overCapacity:overCapacity,
        events:(p.events||[]).concat([{t:elapsed,type:'DISPATCH '+vehicleName+' → '+hospital,by:STATE.me.name||''}])
      });
    });

    const nextHospitals=hospitals.map(function(h){
      if(h.name!==hospital)return h;
      let addRed=0,addYellow=0,addGreen=0;
      nextPatients.forEach(function(p){
        if(!capacityKeys[normU(p.id)])return;
        if(p.secondary==='RED')addRed++;else if(p.secondary==='YELLOW')addYellow++;else if(p.secondary==='GREEN')addGreen++;
      });
      return Object.assign({},h,{redUsed:Number(h.redUsed||0)+addRed,yellowUsed:Number(h.yellowUsed||0)+addYellow,greenUsed:Number(h.greenUsed||0)+addGreen});
    });
    const nextVehicles=vehicles.map(function(v){return v.name===vehicleName?Object.assign({},v,{
      deploymentState:'HOSPITAL_TRIP',workflowState:'HOSPITAL_TRIP',busyStartElapsed:elapsed,outboundMin:outboundMin,returnMin:returnMin,outboundPath:outboundPath,returnPath:returnPath,
      busyUntilElapsed:elapsed+outboundMin+returnMin,busyHospital:hospital,loadingQueuePos:null,parkingSlot:null,loadingDepartureStartMs:sharedNowMs(),loadingDepartureDurationMs:1800,lastDispatchRequestId:dispatchRequestId||null
    }):v;});
    root[KEYS.patients]=nextPatients;
    root[KEYS.hospitals]=nextHospitals;
    root[KEYS.vehicles]=nextVehicles;
    if(requireExplicitLocks){
      const nextLocks=Object.assign({},locksNow);
      wantedIds.forEach(function(id){delete nextLocks[id];});
      delete nextLocks[vehicleLockKey(vehicleName)];
      root[KEYS.locks]=nextLocks;
    }
    summary={allowHospitalTreatment:allowHospitalTreatment,hospital:hospital,sentCount:sentCount,mismatchCount:mismatchCount,acceptedCount:acceptedCount,deadCount:deadCount};
    return root;
  });
  if(!result.committed){if(duplicateSuccess)return true;toast(fail||'ส่งรถไม่สำเร็จ กรุณาลองใหม่','err');return false;}
  if(result.root){
    if(result.root[KEYS.patients])STATE.patients=result.root[KEYS.patients];
    if(result.root[KEYS.hospitals])STATE.hospitals=result.root[KEYS.hospitals];
    if(result.root[KEYS.vehicles])STATE.vehicles=result.root[KEYS.vehicles];
    if(result.root[KEYS.locks])STATE.locks=result.root[KEYS.locks];
  }
  if(!suppressRender)render();
  return true;
}

async function borrowZoneResource(fromZone,toZone,item){
  const allowed=Object.keys(DEFAULT_ZONE_RESOURCES);
  if(allowed.indexOf(fromZone)<0||allowed.indexOf(toZone)<0||fromZone===toZone){toast('เลือกโซนยืมอุปกรณ์ไม่ถูกต้อง','err');return false;}
  const acting=STATE.me.station;
  if(acting!=='GM'&&acting!==toZone){toast('ต้องอยู่ในโซนปลายทางจึงยืมอุปกรณ์ได้','err');return false;}
  const elapsed=elapsedMinutes(STATE.gc);let fail='';
  const result=await kvRootTransaction(function(root){
    const resources=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:STATE.resources;
    const zones=normalizeZoneResources(root[KEYS.zoneResources],resources);
    if(!zones[fromZone]||Number(zones[fromZone][item]||0)<=0){fail=item+' ใน '+fromZone+' หมด';return null;}
    zones[fromZone][item]=Number(zones[fromZone][item]||0)-1;
    zones[toZone][item]=Number(zones[toZone][item]||0)+1;
    const gc=Object.assign({},root[KEYS.gc]||STATE.gc);
    gc.operationsLog=(gc.operationsLog||[]).concat([{t:elapsed,type:'ZONE_BORROW '+item+' '+fromZone+' TO '+toZone,by:STATE.me.name||''}]);
    root[KEYS.zoneResources]=zones;root[KEYS.gc]=gc;return root;
  });
  if(!result.committed){toast(fail||'ยืมอุปกรณ์ไม่สำเร็จ','err');return false;}
  STATE.zoneResources=normalizeZoneResources(result.root[KEYS.zoneResources],STATE.resources);STATE.gc=result.root[KEYS.gc]||STATE.gc;
  toast('ยืม '+item+' จาก '+fromZone.replace('TX_','')+' มา '+toZone.replace('TX_','')+' แล้ว','ok');render(true);return true;
}
const GM_RESOURCE_ZONES=['PRIMARY','SECONDARY','TX_RED','TX_YELLOW','TX_GREEN'];
function carriedResourceCount(carried,item){
  return Object.keys(carried||{}).reduce(function(total,clientId){return total+Math.max(0,Number(carried[clientId]&&carried[clientId][item])||0);},0);
}
async function gmUpdateResourceMatrix(item,zoneCounts,durationSec,weightUnits,options){
  options=options||{};
  const result=await kvRootTransaction(function(root){
    const list=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);});
    const zones=normalizeZoneResources(root[KEYS.zoneResources],list),carried=root[KEYS.carried]||{},gc=Object.assign({},root[KEYS.gc]||STATE.gc);
    GM_RESOURCE_ZONES.forEach(function(zone){zones[zone][item]=Math.max(0,Math.floor(Number(zoneCounts[zone])||0));});
    const baselineTotal=GM_RESOURCE_ZONES.reduce(function(total,zone){return total+Number(zones[zone][item]||0);},0);
    const currentTotal=baselineTotal+carriedResourceCount(carried,item);
    const patch={stock:currentTotal,durationSec:Math.max(1,Number(durationSec)||5),weightUnits:Math.max(1,Math.floor(Number(weightUnits)||2)),triageAllowed:true,addedTotal:baselineTotal};
    root[KEYS.resources]=list.map(function(r){return r.item===item?Object.assign({},r,patch):r;});
    const baseline=(Array.isArray(gc.resourceBaseline)?gc.resourceBaseline:resourceBaselineFromCurrent(list)).map(function(r){return Object.assign({},r);});
    gc.resourceBaseline=baseline.map(function(r){return r.item===item?Object.assign({},r,patch,{stock:baselineTotal}):r;});
    gc.zoneResourceBaseline=normalizeZoneResources(gc.zoneResourceBaseline||root[KEYS.zoneResources],root[KEYS.resources]);
    GM_RESOURCE_ZONES.forEach(function(zone){gc.zoneResourceBaseline[zone][item]=Number(zones[zone][item]||0);});
    gc.resourceConfigVersion=3;
    root[KEYS.zoneResources]=zones;root[KEYS.gc]=gc;return root;
  });
  if(result.committed){
    STATE.resources=result.root[KEYS.resources];STATE.zoneResources=normalizeZoneResources(result.root[KEYS.zoneResources],STATE.resources);STATE.gc=result.root[KEYS.gc];
    if(!options.silent)toast('บันทึก '+item+' แยกตาม Zone แล้ว','ok');
    if(options.render!==false)render();
    return true;
  }
  if(!options.silent)toast('บันทึกทรัพยากรไม่สำเร็จ','err');
  return false;
}
const gmResourceAutoSaveTimers={},gmResourceAutoSavePending={},gmResourceAutoSaveBusy={};
function resourceDomKey(item){
  let hash=2166136261,text=String(item||'');
  for(let i=0;i<text.length;i++){hash^=text.charCodeAt(i);hash=Math.imul(hash,16777619);}
  return 'resource_'+(hash>>>0).toString(36);
}
function collectGmResourceMatrixRow(item){
  const counts={};
  GM_RESOURCE_ZONES.forEach(function(zone){counts[zone]=Math.max(0,Math.floor(Number(val('res_zone_'+zone+'_'+item))||0));});
  return {counts:counts,durationSec:Math.max(1,Number(val('res_dur_'+item))||5),weightUnits:Math.max(1,Math.floor(Number(val('res_weight_'+item))||2))};
}
function setGmResourceSaveStatus(item,state,textValue){
  const el=document.getElementById('res_status_'+resourceDomKey(item));
  if(!el)return;
  el.className='resource-autosave-status '+(state||'');el.textContent=textValue||'';
}
function updateGmResourceRowTotal(item,payload){
  const el=document.getElementById('res_total_'+resourceDomKey(item));
  if(el)el.textContent=GM_RESOURCE_ZONES.reduce(function(total,zone){return total+Number(payload.counts[zone]||0);},0);
}
function scheduleGmResourceMatrixSave(item,immediate){
  item=String(item||'');if(!item)return;
  const payload=collectGmResourceMatrixRow(item);gmResourceAutoSavePending[item]=payload;updateGmResourceRowTotal(item,payload);
  if(gmResourceAutoSaveTimers[item]){clearTimeout(gmResourceAutoSaveTimers[item]);delete gmResourceAutoSaveTimers[item];}
  setGmResourceSaveStatus(item,'saving',immediate?'กำลังบันทึก…':'รอบันทึก…');
  if(immediate){flushGmResourceMatrixSave(item);return;}
  gmResourceAutoSaveTimers[item]=setTimeout(function(){delete gmResourceAutoSaveTimers[item];flushGmResourceMatrixSave(item);},550);
}
async function flushGmResourceMatrixSave(item){
  if(gmResourceAutoSaveBusy[item]||!gmResourceAutoSavePending[item])return;
  const payload=gmResourceAutoSavePending[item];delete gmResourceAutoSavePending[item];gmResourceAutoSaveBusy[item]=true;
  setGmResourceSaveStatus(item,'saving','กำลังบันทึก…');
  const ok=await gmUpdateResourceMatrix(item,payload.counts,payload.durationSec,payload.weightUnits,{silent:true,render:false});
  gmResourceAutoSaveBusy[item]=false;
  setGmResourceSaveStatus(item,ok?'saved':'error',ok?'✓ บันทึกแล้ว':'บันทึกไม่สำเร็จ');
  if(gmResourceAutoSavePending[item])flushGmResourceMatrixSave(item);
}
async function gmAddResource(item, durationSec, weightUnits, zoneCounts){

  const rec={item:item,stock:stock,durationSec:Math.max(1,Number(durationSec)||5),weightUnits:Math.max(1,Math.floor(Number(weightUnits)||2)),triageAllowed:true,addedTotal:stock};
  const result=await kvRootTransaction(function(root){
    const list=Array.isArray(root[KEYS.resources])?root[KEYS.resources]:DEFAULT_RESOURCES.map(function(r){return Object.assign({},r);}),gc=Object.assign({},root[KEYS.gc]||STATE.gc),baseline=(Array.isArray(gc.resourceBaseline)?gc.resourceBaseline:resourceBaselineFromCurrent(list)).map(function(r){return Object.assign({},r);});
    if(list.some(function(r){return String(r.item).toLowerCase()===item.toLowerCase();}))return null;

    gc.zoneResourceBaseline=normalizeZoneResources(gc.zoneResourceBaseline||root[KEYS.zoneResources],next);
    GM_RESOURCE_ZONES.forEach(function(zone){gc.zoneResourceBaseline[zone][item]=Number(zones[zone][item]||0);});
    gc.resourceConfigVersion=3;
    root[KEYS.gc]=gc;return root;
  });
  if(result.committed){STATE.resources=result.root[KEYS.resources];STATE.zoneResources=normalizeZoneResources(result.root[KEYS.zoneResources],STATE.resources);STATE.gc=result.root[KEYS.gc];toast('เพิ่มทรัพยากร '+item+' และบันทึกเป็นค่าตั้งต้นแล้ว','ok');render();}else toast('มีทรัพยากรชื่อนี้แล้ว','err');
}

async function gmDeleteHospital(name){
  if(STATE.gc.mapSettings && STATE.gc.mapSettings.useMap){toast('กรุณาปิด “ใช้ Map” ก่อนลบโรงพยาบาลที่กรอกเอง','err');return;}
  const assigned=STATE.patients.some(function(p){return p.hospital===name && (p.stage==='TRANSFER'||p.stage==='HOSPITAL');});
  if(assigned){toast('ลบไม่ได้: มีผู้ป่วยกำลังรอส่งหรืออยู่ใน Hospital simulation','err');return;}
  await kvRootTransaction(function(root){
    root[KEYS.hospitals]=(root[KEYS.hospitals]||DEFAULT_HOSPITALS).filter(function(h){return h.name!==name;});
    root[KEYS.vehicles]=(root[KEYS.vehicles]||DEFAULT_VEHICLES).map(function(v){return v.busyHospital===name?Object.assign({},v,{busyHospital:null}):v;});
    return root;
  });
  await refreshAll();toast('ลบโรงพยาบาล '+name+' แล้ว','ok');
}

/* The embedded Scene Setup module owns a live Leaflet map instance that must
   NOT be destroyed by innerHTML replacement while GM is actively working in
   it (dragging pins etc. isn't caught by the [data-preserve] focus-guard
   below, since map drags don't focus a form control). So once mounted, we
   skip full re-renders entirely while GM stays on that tab; we only rebuild
   when the tab actually changes (which calls render(true) and, in the else
   branch below, tears the map down cleanly first). */
let sceneMounted = false;
/* Stations that get the read-only live Scene Map panel. GM also gets it
   (optional, per spec) whenever GM isn't already on the Scene Setup editor
   tab, since that tab has its own live map. */
const SCENE_VIEWER_STATIONS = ['COMMANDER','LOADING','PARKING'];
let sceneViewerMounted = false;
let renderGuardsBound=false;
function rosterStationSnapshot(){
  const compact={};
  Object.keys(STATE.roster||{}).forEach(function(name){compact[name]=(STATE.roster[name]&&STATE.roster[name].station)||null;});
  return compact;
}
function renderSnapshotForCurrentView(){
  const st=STATE.me.station;
  const base={gc:STATE.gc,me:STATE.me,ready:STATE.ready,fbConnected:STATE.fbConnected,toasts:STATE.toasts,ui:STATE.ui,locks:compactActiveLocks(),communicationHeads:communicationHeadsSignature(STATE.communications)};
  const rosterStations=rosterStationSnapshot();
  if(!STATE.me.name||!STATE.ready)return JSON.stringify(Object.assign(base,{roster:rosterStations}));
  if(st==='GM')return JSON.stringify(Object.assign(base,{cases:STATE.cases,resources:STATE.resources,zoneResources:STATE.zoneResources,hospitals:STATE.hospitals,vehicles:STATE.vehicles,patients:STATE.patients,roster:rosterStations,scene:STATE.scene,gmTab:STATE.gmTab},STATE.gmTab==='archives'?{archives:STATE.archives,archivesStatus:STATE.archivesStatus,selectedArchive:STATE.selectedArchive,selectedArchiveStatus:STATE.selectedArchiveStatus,archiveReviewTab:STATE.archiveReviewTab,archiveDebriefPlayerFilter:STATE.archiveDebriefPlayerFilter,archiveDebriefCategoryFilters:STATE.archiveDebriefCategoryFilters}:{}));
  /* Every non-GM sees the same 2D incident world, so changes in every zone must
     invalidate the render even when the player is currently standing outside. */
  if(st!=='GM'&&st!=='COMMANDER')return JSON.stringify(Object.assign(base,{cases:STATE.cases,resources:STATE.resources,zoneResources:STATE.zoneResources,hospitals:STATE.hospitals,vehicles:STATE.vehicles,patients:STATE.patients,roster:rosterStations,scene:STATE.scene}));
  if(st==='COMMANDER')return JSON.stringify(Object.assign(base,{roster:rosterStations,hospitals:STATE.hospitals,vehicles:STATE.vehicles,scene:STATE.scene}));
  let relevant=[];
  if(st==='PRIMARY')relevant=STATE.patients.filter(function(p){return p.stage==='PRIMARY'||(p.stage==='TRANSIT'&&p.transit&&p.transit.fromStage==='PRIMARY');});
  else if(st==='SECONDARY')relevant=STATE.patients.filter(function(p){return p.stage==='SECONDARY'||(p.stage==='TRANSIT'&&p.transit&&p.transit.fromStage==='SECONDARY');});
  else if(st.indexOf('TX_')===0){const zone=st.slice(3);relevant=STATE.patients.filter(function(p){return p.stage==='TX'&&p.txZone===zone;}).map(function(p){const copy=Object.assign({},p);delete copy.dx;delete copy.txNote;return copy;});}
  else if(st==='LOADING'||st==='PARKING')relevant=STATE.patients.filter(function(p){return p.stage==='TRANSFER';});
  else if(st==='DISCHARGE')relevant=STATE.patients.filter(function(p){return p.stage==='CLOSED';});
  const scoped={patients:relevant,roster:rosterStations};
  if(st==='PRIMARY'||st==='SECONDARY'||st.indexOf('TX_')===0){scoped.resources=STATE.resources;scoped.zoneResources=STATE.zoneResources;}
  if(st==='LOADING'||st==='PARKING')Object.assign(scoped,{hospitals:STATE.hospitals,vehicles:STATE.vehicles,scene:STATE.scene});
  return JSON.stringify(Object.assign(base,scoped));
}
function render(force){
  const onSceneTab = STATE.ready && STATE.me.station==='GM' && STATE.gmTab==='scene';
  if(onSceneTab && sceneMounted){ updateTwoDPlayerHost(); updateSceneViewerPanel(); renderCommunicationUI(); refreshHowToAfterRender(); return; }

  const snap=renderSnapshotForCurrentView();
  if(!force && snap===STATE._snapshot){updateLiveTimersOnly();updateTwoDPlayerHost();updateSceneViewerPanel();renderCommunicationUI();refreshHowToAfterRender();return;}
  STATE._snapshot = snap;

  const active = document.activeElement;
  let preserved = null;
  if(active && active.id && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName||'')){
    preserved = {id:active.id, value:active.value, selStart:active.selectionStart, selEnd:active.selectionEnd};
  }

  const app = document.getElementById('app');
  if(!renderGuardsBound){
    renderGuardsBound=true;
    app.addEventListener('pointerdown',function(e){if(e.target.closest('[data-act]'))actionPointerBusy=true;if(e.target.closest('select'))selectMenuBusy=true;},true);
    app.addEventListener('focusin',function(e){if(e.target.tagName==='SELECT')selectMenuBusy=true;},true);
    app.addEventListener('focusin',function(e){if(e.target.closest('[data-case-field]'))caseFormBusy=true;},true);
    app.addEventListener('change',function(e){if(e.target.closest('select')){selectMenuBusy=false;if(backgroundRenderPending)scheduleBackgroundRender();}},true);
    app.addEventListener('focusout',function(e){if(e.target.tagName==='SELECT'){selectMenuBusy=false;if(backgroundRenderPending)scheduleBackgroundRender();}},true);
    app.addEventListener('focusout',function(e){if(!e.target.closest('[data-case-field]'))return;setTimeout(function(){caseFormBusy=!!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('[data-case-field]'));if(!caseFormBusy&&backgroundRenderPending)scheduleBackgroundRender();},0);},true);
    window.addEventListener('pointerup',function(){if(!actionPointerBusy)return;actionPointerBusy=false;if(backgroundRenderPending&&!selectMenuBusy&&!caseFormBusy)scheduleBackgroundRender();},true);
    window.addEventListener('pointercancel',function(){actionPointerBusy=false;selectMenuBusy=false;if(backgroundRenderPending)scheduleBackgroundRender();},true);
  }
  app.innerHTML = buildView();

  if(preserved){
    const el = document.getElementById(preserved.id);
    if(el){
      el.value = preserved.value;
      el.focus();
      if(el.tagName==='SELECT')selectMenuBusy=false;
      try{ el.setSelectionRange(preserved.selStart, preserved.selEnd); }catch(e){}
    }
  }

  if(onSceneTab){
    sceneMounted = true;
    window.SceneApp && window.SceneApp.mount({
      container: document.getElementById('scRoot'),
      data: STATE.scene && STATE.scene.data,
      hospitals: STATE.hospitals
    });
  }else if(sceneMounted){
    sceneMounted = false;
    window.SceneApp && window.SceneApp.destroy();
  }

  updateTwoDPlayerHost();
  updateSceneViewerPanel();
  renderCommunicationUI();
  refreshHowToAfterRender();
}

/* Shows/hides + mounts/destroys/updates the persistent #sceneViewerHost
   panel. The panel's DOM node lives outside #app (untouched by the
   app.innerHTML rebuild above), so mount() only runs once when a relevant
   station first becomes active; every other call here is a cheap
   setData()/setVehicles() update — this is what lets vehicle markers
   animate smoothly on every ~1s render tick without the map flickering
   or re-initializing. */
function updateSceneViewerPanel(){
  const host = document.getElementById('sceneViewerHost');
  if(!host) return;
  const st = STATE.me && STATE.me.station;
  const archiveView=st==='GM'&&STATE.gmTab==='archives'&&STATE.selectedArchive,sceneSource=archiveView?(STATE.selectedArchive.scene||DEFAULT_SCENE):STATE.scene,vehicleSource=archiveView?(STATE.selectedArchive.vehicles||[]):STATE.vehicles,gcSource=archiveView?(STATE.selectedArchive.gc||DEFAULT_GC):STATE.gc;
  const wantsIt = STATE.ready && st==='GM' && sceneSource && sceneSource.data && (archiveView?STATE.archiveReviewTab==='dashboard':(sceneReady()&&STATE.gmTab!=='scene'&&STATE.gmTab!=='archives'));
  if(!wantsIt){
    if(sceneViewerMounted){ sceneViewerMounted=false; window.SceneViewer && window.SceneViewer.destroy(); }
    host.classList.add('hidden');
    return;
  }
  host.classList.remove('hidden');
  if(!sceneViewerMounted){
    sceneViewerMounted = true;
    window.SceneViewer && window.SceneViewer.mount({container: document.getElementById('sceneViewerMap'), data: sceneSource.data});
  }else{
    window.SceneViewer && window.SceneViewer.setData(sceneSource.data);
  }
  window.SceneViewer && window.SceneViewer.setVehicles(vehicleSource, elapsedMinutes(gcSource));
}

  STATE.ui.twoD.panelOpen=true;STATE.ui.twoD.supplyZone=null;
  STATE.ui.twoD.panelMinimized=(typeof window!=='undefined'&&window.innerWidth&&window.innerHeight&&window.innerWidth*window.innerHeight<420*680);
  if(key)STATE.ui.twoD.detailPatientId=null;else STATE.ui.twoD.detailPatientId=normU(id);

async function focusTwoDSupply(zone){STATE.ui.twoD.supplyZone=zone;STATE.ui.twoD.panelOpen=true;STATE.ui.twoD.panelMinimized=(typeof window!=='undefined'&&window.innerWidth&&window.innerHeight&&window.innerWidth*window.innerHeight<420*680);saveLocalSession();render(true)}
async function boardTransferPatientFromPanel(id,vehicleId){
  const patient=STATE.patients.find(function(x){return normU(x.id)===normU(id);});
  const vehicle=STATE.vehicles.find(function(v){return v.name===vehicleId;});
  if(!patient||patient.stage!=='TRANSFER'){toast('ผู้ป่วยไม่ได้อยู่ใน Loading แล้ว','err');return false;}
  if(patientIsDead(patient,elapsedMinutes(STATE.gc))){toast('ผู้ป่วยเสียชีวิตแล้ว ไม่สามารถนำขึ้นรถได้','err');return false;}
  if(!vehicle||vehicleWorkflowState(vehicle,elapsedMinutes(STATE.gc))!=='LOADING_BAY'){toast('ยังไม่มีรถหน้า Loading Bay','err');return false;}
  const requestId='PANEL_BOARD_'+sharedNowMs().toString(36)+'_'+Math.random().toString(36).slice(2,7);
  const ok=effectiveCanWalk(patient)==='yes'
    ?await boardPatientToVehicle(patient.id,vehicle.name,requestId)
    :await requestPorterJob(patient.id,'LOADING','VEHICLE:'+vehicle.name,requestId);
  if(ok){STATE.ui.twoD.detailPatientId=null;STATE.ui.twoD.panelMinimized=true;saveLocalSession();render(true);}
  return !!ok;
}

function buildView(){
  if(!fbReady){
    return viewSetupNeeded();
  }
  const banner = STATE.fbConnected===false&&firebaseWarningVisible ? viewConnErrorBanner() : '';
  if(!STATE.me.name){
    return banner + viewJoin();
  }
  if(!STATE.ready){
    return banner + '<div class="waitwrap"><div class="spinner"></div><p>กำลังโหลด...</p></div>';
  }
  if(STATE.me.station==='GM'||STATE.me.station==='COMMANDER')return banner + viewShell(viewStationBody());
  return banner + viewTwoDWorld();
}

function viewWaiting(){
  const names = Object.keys(STATE.roster);
  const rosterHtml = names.length ? names.map(function(n){
    const r = STATE.roster[n];
    const live = (Date.now()-(r.lastSeen||0)) < 45000;
    return '<div class="roster-row"><span class="'+(live?'dotlive':'dotstale')+'"></span>'
      + '<span class="roster-name">'+esc(n)+(n===STATE.me.name?' (คุณ)':'')+'</span>'
      + '<span class="badge '+(r.station?'ok':'wait')+'">'+(r.station ? esc(stationLabel(r.station)) : 'ยังไม่ได้รับมอบหมาย')+'</span>'
      + '</div>';

  + '<div class="waitwrap">'
  +   '<div class="spinner"></div>'
  +   '<h2 style="margin-top:6px;">รอ GM มอบหมายหน้าที่ให้ '+esc(STATE.me.name)+'</h2>'

function viewShell(bodyHtml){

  if(!STATE.me)return null;

function howToTargetForStep(step){
  if(!step||!step.selector)return null;
  const selectors=Array.isArray(step.selector)?step.selector:[step.selector];
  for(let i=0;i<selectors.length;i++){const el=document.querySelector(selectors[i]);if(el)return el;}
  return null;
}
function openHowTo(){
  const key=currentHowToKey();if(!key)return;
  if(key==='GM'&&STATE.gmTab!=='control'){STATE.gmTab='control';render(true);}
  HOWTO_STATE.open=true;HOWTO_STATE.key=key;HOWTO_STATE.index=0;renderHowTo();
}
function closeHowTo(){
  HOWTO_STATE.open=false;HOWTO_STATE.key=null;HOWTO_STATE.index=0;
  const host=document.getElementById('howToPlayHost');if(host){host.classList.add('hidden');host.innerHTML='';}
}
function moveHowTo(delta){
  if(!HOWTO_STATE.open)return;
  const steps=howToStepsForKey(HOWTO_STATE.key),next=HOWTO_STATE.index+delta;
  if(next>=steps.length){try{localStorage.setItem('mciHowToCompleted:'+HOWTO_STATE.key,'1');}catch(e){}closeHowTo();return;}
  HOWTO_STATE.index=Math.max(0,next);renderHowTo();
}
function renderHowTo(){
  const host=document.getElementById('howToPlayHost');if(!host||!HOWTO_STATE.open)return;
  if(HOWTO_STATE.key!==currentHowToKey()){closeHowTo();return;}

function renderClockPill(){
  const archived=STATE.me&&STATE.me.station==='GM'&&STATE.gmTab==='archives'&&STATE.selectedArchive,gc=archived?(STATE.selectedArchive.gc||DEFAULT_GC):STATE.gc;
  const elapsed = elapsedMinutes(gc);

  return ''

  +   '<span class="pill status-'+gc.status+'">● '+statusLabel+'</span>'

  +   '<span class="pill">Max <b>'+gc.maxGameMin+'</b> น.</span>'
  + '</div>';

function fmtClock(elapsedMin){
  const totalSec = Math.max(0, Math.round(elapsedMin*60));
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function patientEventTime(p,type){
  const event=(p&&p.events||[]).find(function(e){return e&&e.type===type;});
  return event&&Number.isFinite(Number(event.t))?Number(event.t):null;
}
function patientZoneEntryTime(p,zone){
  if(!p)return 0;
  if(zone==='PRIMARY')return Number(p.createdAt)||0;
  if(zone==='SECONDARY'){
    if(p.stage==='TRANSIT'&&p.transit&&p.transit.toStage==='SECONDARY')return Number(p.transit.arriveElapsed)||0;
    return p.secondaryArrivalTime!=null?Number(p.secondaryArrivalTime):(p.primaryTime!=null?Number(p.primaryTime):Number(p.createdAt)||0);
  }
  if(String(zone||'').indexOf('TX_')===0){
    if(p.stage==='TRANSIT'&&p.transit&&p.transit.toStage==='TX')return Number(p.transit.arriveElapsed)||0;
    return p.txArrivalTime!=null?Number(p.txArrivalTime):(p.secondaryTime!=null?Number(p.secondaryTime):Number(p.createdAt)||0);
  }
  if(zone==='TRANSFER'){
    const eventTime=patientEventTime(p,'TO_TRANSFER');
    return p.transferArrivalTime!=null?Number(p.transferArrivalTime):(eventTime!=null?eventTime:(p.txStartTime!=null?Number(p.txStartTime):Number(p.createdAt)||0));
  }
  if(zone==='HOSPITAL'){
    if(p.hospitalArrivalTime!=null)return Number(p.hospitalArrivalTime);
    if(p.hospitalCare&&p.hospitalCare.arrivalAt!=null)return Number(p.hospitalCare.arrivalAt);
    if(p.hospitalPlannedArrivalTime!=null)return Number(p.hospitalPlannedArrivalTime);
    return p.transferTime!=null?Number(p.transferTime):Number(p.createdAt)||0;
  }
  return Number(p.createdAt)||0;
}
function zoneEntryClockHtml(p,zone){
  const t=patientZoneEntryTime(p,zone);
  const wallTime=STATE.gc&&STATE.gc.startTime?new Date(Number(STATE.gc.startTime)+t*60000).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):fmtClock(t);
  const projected=p.stage==='TRANSIT'||(zone==='HOSPITAL'&&p.stage==='HOSPITAL'&&p.hospitalCare&&elapsedMinutes(STATE.gc)<Number(p.hospitalCare.arrivalAt));
  return '<div class="pixel-zone-time">'+(projected?'ถึง ':'เข้า ')+esc(wallTime)+'</div>';
}
function sortByZoneEntry(zone){
  return function(a,b){
    const diff=patientZoneEntryTime(a,zone)-patientZoneEntryTime(b,zone);
    return diff||String(a.id||'').localeCompare(String(b.id||''),undefined,{numeric:true});
  };
}

const CLINICAL_CHECK_SECONDS=5;
const CLINICAL_CHECK_LABELS={bp:'วัด BP + Pulse',o2sat:'วัด O₂ sat',exam:'ตรวจร่างกาย'};
function clinicalCheckRecord(p,kind){
  const record=p&&p.clinicalChecks&&p.clinicalChecks[kind];

}
function clinicalCheckComplete(p,kind,elapsed){
  const record=clinicalCheckRecord(p,kind),end=record&&Number(record.completeAt);

}
function clinicalCheckControlHtml(p,kind,stage,elapsed){

  return '<button class="btn sm primary clinical-measure-btn" data-act="clinicalCheck" data-pid="'+esc(p.id)+'" data-kind="'+esc(kind)+'" data-stage="'+esc(stage)+'" '+disabled+'>'+esc(label)+' · 5 วิ</button>';

async function startClinicalCheck(patientId,kind,stage){
  patientId=normU(patientId);kind=String(kind||'').toLowerCase();stage=normU(stage);
  if(STATE.gc.status!=='RUNNING'){toast('เริ่มวัดได้หลังเริ่มเกม','err');return false;}
  if(['bp','o2sat','exam'].indexOf(kind)<0||['SECONDARY','TX'].indexOf(stage)<0){toast('รายการตรวจไม่ถูกต้อง','err');return false;}
  if(!canEditLockedPatient(patientId))return false;
  const startedAt=elapsedMinutes(STATE.gc),completeAt=startedAt+CLINICAL_CHECK_SECONDS/60;let fail='';
  const saved=await mutatePatients(function(list){
    const index=list.findIndex(function(p){return normU(p.id)===patientId;});
    if(index<0){fail='ไม่พบผู้ป่วย No. '+patientId;return null;}
    const patient=list[index];
    if(patient.stage!==stage){fail='ผู้ป่วยไม่ได้อยู่ใน Zone นี้แล้ว';return null;}
    const previous=clinicalCheckRecord(patient,kind);
    if(previous&&Number(previous.completeAt)>startedAt){fail=(CLINICAL_CHECK_LABELS[kind]||kind)+' กำลังดำเนินการอยู่';return null;}
    if(previous&&Number.isFinite(Number(previous.completeAt))&&startedAt>=Number(previous.completeAt)){fail='รายการนี้วัดเสร็จแล้ว';return null;}
    const checks=Object.assign({},patient.clinicalChecks||{});
    checks[kind]={startedAt:startedAt,completeAt:completeAt,durationSec:CLINICAL_CHECK_SECONDS,by:STATE.me.name||'',stage:stage};
    const next=Object.assign({},patient,{clinicalChecks:checks,events:(patient.events||[]).concat([{t:startedAt,type:'CLINICAL_CHECK_START '+kind.toUpperCase(),by:STATE.me.name||''}])});
    const out=list.slice();out[index]=next;return out;
  });
  if(!saved){if(fail)toast(fail,'err');return false;}
  toast('เริ่ม'+(CLINICAL_CHECK_LABELS[kind]||kind)+' — ใช้เวลา 5 วินาที','ok');
  return true;
}

  const queue=STATE.patients.filter(function(p){return p.stage==='TX'&&p.txZone===zone;}).sort(sortByZoneEntry('TX_'+zone));
  const focusKey='TX_'+zone;
  const p=focusedPatient(focusKey,queue);
  const otherZones=TX_ZONES.filter(function(z){return z!==zone;});
  let card='';
  if(p){
    const status=computeTxStatus(p,findCase(STATE.cases,p.id),elapsed),dead=status==='DEAD',busy=hasAnyTxInProgress(p,elapsed);
    card='<div class="patient-card stripe-'+zone+'">'
      +'<div class="pidrow">'+patientFocusAvatarHtml(p,zone)+'<span class="pid">#'+esc(p.id)+'</span>'+canWalkBadge(effectiveCanWalk(p))+(dead?'<span class="badge dead">DEAD</span>':'')+'</div>'
      +clinicalCaseDetailsHtml(p,{mode:'staged',stage:'TX',elapsed:elapsed})
      +'<label class="label" style="margin-top:8px">Diagnosis / Impression (Dx)</label><input type="text" data-act="txDx" data-pid="'+esc(p.id)+'" data-preserve id="txdx_'+esc(p.id)+'" value="'+esc(p.dx||'')+'" placeholder="เช่น suspected fracture, chest injury">'
      +(dead?'<div class="hint" style="color:var(--red);margin-top:8px">'+esc(deathReasonFor(p,elapsed))+' — ค้างที่ Treatment</div>':'<div style="margin-top:10px;">'+visibleTxSlotIndexes(p).map(function(i){return txCarriedSlotHtml(p,i,elapsed);}).join('')+'</div>'
        +'<div class="subrow" style="margin-top:10px;flex-wrap:wrap;gap:6px;">'
        +'<button class="btn sm primary" data-act="txDispo" data-pid="'+esc(p.id)+'" data-value="TRANSFER" '+(busy?'disabled':'')+'>ส่งต่อ Transfer →</button>'
        +'<button class="btn sm" data-act="txDispo" data-pid="'+esc(p.id)+'" data-value="DISCHARGE" '+(busy?'disabled':'')+'>Discharge</button>'
        +otherZones.map(function(z){return '<button class="btn sm" data-act="txMoveZone" data-pid="'+esc(p.id)+'" data-to="'+z+'" '+(busy?'disabled':'')+'>ย้ายไป '+z+' →</button>';}).join('')
        +'</div>')
      +'</div>';
  }
  return '<div class="station-hero"><div class="titlewrap"><div class="eyebrow">TREATMENT STATION · '+zone+'</div><h1>'+stationHeading('treatment','Treatment · '+zone)+'</h1></div></div>'
    +(card||'<div class="focused-patient-empty">เดินเข้าไปหาผู้ป่วยในฉากเพื่อเริ่ม Treatment</div>');
}

function transferDiagnosis(p){
  return norm(p&&p.dx)||norm(p&&p.txNote)||'—';
}
function transferTreatmentSummary(p,elapsed){
  const done=(p&&p.tx||[]).filter(Boolean).filter(function(slot){return txSlotStatus(slot,elapsed)==='SUCCESS';}).map(function(slot){return slot.item;});
  return done.length?done.join(', '):'ยังไม่มี Treatment ที่สำเร็จ';
}
function vehicleRequestControls(level,label){

function viewDispatch(embedded){
  const elapsed = elapsedMinutes(STATE.gc);
  const rows = STATE.vehicles.map(function(v){
    const status = vehicleEffectiveStatus(v, elapsed);
    const assigned = STATE.patients.filter(function(p){ return p.stage==='TRANSFER' && p.vehicle===v.name; });
    const ids = assigned.map(function(p){ return '#'+p.id; }).join(', ') || '—';
    const hospitalsList = uniq(assigned.map(function(p){ return p.hospital; }).filter(Boolean));
    const hospitalLabel = hospitalsList.length===0 ? '—' : hospitalsList.length===1 ? hospitalsList[0] : 'MIXED';
    const sitting = assigned.filter(function(p){ return effectiveCanWalk(p)==='yes'; }).length;
    const lying = assigned.filter(function(p){ return effectiveCanWalk(p)!=='yes'; }).length;
    const load = calcVehicleLoad(v.type, assigned.length, sitting, lying, hospitalsList.length);
    const canSend = status==='AVAILABLE' && hospitalsList.length===1 && load.ok && assigned.length>0;
    const returnInfo = status==='BUSY' ? ('กลับใน '+round1(v.busyUntilElapsed-elapsed)+' น. ('+esc(v.busyHospital||'')+')') : '';
    return '<tr class="row-hover">'
      + '<td><b>'+esc(v.name)+'</b><div class="hint">'+vehicleCapacityNote(v.type)+'</div></td>'
      + '<td><span class="badge neutral">'+v.type+'</span></td>'
      + '<td>'+(status==='AVAILABLE' ? '<span class="badge ok">ว่าง</span>' : '<span class="badge wait">ไม่ว่าง</span>')+'<div class="hint">'+returnInfo+'</div></td>'
      + '<td style="font-family:var(--font-mono);font-size:12px;">'+ids+'</td>'
      + '<td>'+hospitalLabel+'</td>'
      + '<td>'+(load.ok ? '<span class="badge ok">'+load.label+'</span>' : '<span class="badge bad">'+load.label+'</span>')+'</td>'
      + '<td><button class="btn sm primary" data-act="dispatchSend" data-vehicle="'+esc(v.name)+'" '+(canSend?'':'disabled')+'>ส่งรถ (SEND)</button></td>'
      + '</tr>';
  }).join('');

  const table = '<div class="card"><table><thead><tr><th>Vehicle</th><th>Type</th><th>Status</th><th>ผู้ป่วยบนรถ</th><th>ปลายทาง</th><th>โหลด</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';

  if(embedded) return table;
  return ''
  + '<div class="station-hero"><div class="titlewrap"><div class="eyebrow">TRANSPORT OPERATIONS</div><h1>'+stationHeading('transfer','Vehicle Dispatch')+'</h1></div></div>'
  + table;
}

function dashboardPatientZone(p){
  if(p.stage==='PRIMARY')return 'PRIMARY';
  if(p.stage==='SECONDARY')return 'SECONDARY';
  if(p.stage==='TRANSIT'&&p.transit){
    if(p.transit.toStage==='SECONDARY')return 'SECONDARY';
    if(p.transit.toStage==='TX')return 'TX_'+(p.transit.txZone||p.secondary||'RED');
  }
  if(p.stage==='TX')return 'TX_'+(p.txZone||p.secondary||'RED');
  if(p.stage==='TRANSFER')return 'TRANSFER';
  if(p.stage==='HOSPITAL')return 'HOSPITAL';
  if(p.stage==='CLOSED'&&p.hospital)return 'HOSPITAL';
  return null;
}
function dashboardPatientColor(p,elapsed){

}
function dashboardPatientSub(p,zone,elapsed){
  if(p.stage==='TRANSIT')return 'กำลังเคลื่อนย้าย';

    return p.hospitalOutcome==='SURVIVED'?'รับรักษาแล้ว':(p.hospital||'สิ้นสุดการส่ง');

  const active=(p.tx||[]).find(function(slot){return slot&&txSlotStatus(slot,elapsed)==='IN_PROGRESS';});

function zoneStaffActivity(name,stationIds,elapsed){
  for(let i=0;i<STATE.patients.length;i++){
    const p=STATE.patients[i];
    const slot=(p.tx||[]).find(function(x){
      return x&&x.staffName===name&&txSlotStatus(x,elapsed)==='IN_PROGRESS'&&stationIds.indexOf(treatmentStationForSlot(p,x))>-1;
    });
    if(slot)return 'กำลังรักษา No. '+p.id+' · '+slot.item;
  }
  let latest=null;
  STATE.patients.forEach(function(p){
    (p.events||[]).forEach(function(e){
      if(e.by===name&&e.t<=elapsed&&(!latest||e.t>latest.t))latest={t:e.t,type:e.type,by:e.by,patient:p};
    });
  });
  if(latest&&elapsed-latest.t<=5)return 'ล่าสุด '+fmtMin(latest.t)+' · '+timelineDescription(latest);
